substitutions:
  device_name: ai-helper
  friendly_name: AI Helper
  ap_ssid: AP-AI-Helper
  ap_password: password
  time_zone: Europe/Kyiv
  wifi_rssi_update: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  build_flags:
    - -DAI_HELPER_MOUSE_MOVER_BUILD_ENABLED=1
    - -DAI_HELPER_SEMAPHORE_BUILD_ENABLED=1
  includes:
    - ai-helper-semaphore.h
    - ai-helper-mouse-mover.h
  on_boot:
    priority: -10
    then:
      - script.execute: sem_apply_status_outputs

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # Applied from the boot-log hints ("under esp32 > framework > advanced").
      # Drop the unused flash vendor drivers (this board's flash uses the generic one).
      flash_chip: generic
      # Boot log reports "ESP32 Chip: ... rev3.1". Firmware built with this minimum
      # will NOT boot on a chip older than rev 3.1 - revert if this image is ever
      # flashed to a different/older ESP32 board.
      minimum_chip_revision: "3.1"
      # Needs the ESP-IDF >= 5.1 bootloader; the boot log confirmed this device has it.
      sram1_as_iram: true
    sdkconfig_options:
      # Baseline task-watchdog window (default 5s). http_request temporarily
      # raises this to its watchdog_timeout during a request; this covers the
      # rest of the main loop (LCD, servo cycles) against transient stalls.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

packages:
  common: !include ai-helper-common.yaml
  semaphore: !include ai-helper-semaphore.yaml
  mouse_mover: !include ai-helper-mouse-mover.yaml
