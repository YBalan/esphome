substitutions:
  # Device identity
  device_name: ai-helper
  friendly_name: AI Helper

  # Fallback AP
  ap_ssid: AP-AI-Helper
  ap_password: password

  # Timezone
  time_zone: Europe/Kyiv

  # Diagnostics cadence
  wifi_rssi_update: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - ai-helper-semaphore.h
    - ai-helper-mouse-mover.h
  on_boot:
    priority: -10
    then:
      - script.execute: sem_apply_status_outputs

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  semaphore: !include ai-helper-semaphore.yaml
  mouse_mover: !include ai-helper-mouse-mover.yaml

logger:
  level: INFO

ota:
  - platform: esphome

time:
  - platform: sntp
    id: ha_time
    timezone: ${time_zone}

wifi:
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
  fast_connect: true
  reboot_timeout: 0s

captive_portal:

web_server:
  port: 80

sensor:
  - platform: wifi_signal
    name: ${friendly_name} WiFi RSSI
    id: wifi_rssi
    update_interval: ${wifi_rssi_update}
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_rssi
    name: ${friendly_name} WiFi Signal Percent
    unit_of_measurement: "%"
    entity_category: diagnostic
    device_class: ""
    filters:
      - lambda: return min(max(2 * (x + 100.0f), 0.0f), 100.0f);
