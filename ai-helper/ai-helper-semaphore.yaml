select:
  - platform: template
    id: sem_ai_status_select
    name: ${friendly_name} AI Status
    optimistic: true
    restore_value: true
    options: [ "Idle", "Reasoning", "Done", "Need User Action", "Allow Action", "Custom1", "Custom2" ]
    initial_option: ${sem_init_status_option}
    set_action:
      - logger.log:
          level: INFO
          format: "sem_ai_status_select set_action with option='%s'"
          args: [ 'x.c_str()' ]
      - lambda: |-
          if (ai_helper::semaphore::update_status_from_option_and_log(x, id(sem_status_code))) {
            id(sem_apply_status_outputs).execute();
          }

  - platform: template
    id: sem_sel_reasoning_color
    name: ${friendly_name} Reasoning Color
    optimistic: true
    restore_value: true
    entity_category: config
    options: ${color_options}
    initial_option: ${sem_init_reasoning_color_option}
    set_action:
      - script.execute: sem_apply_status_outputs

  - platform: template
