  # Remaining usage/quota (%) for the active AI tool (Claude Code, Copilot, ...).
  # Agent hooks push the value over HTTP with the web_server REST API, addressing
  # the entity by its URL-encoded display name (object-id URLs are deprecated and
  # removed in ESPHome 2026.7.0):
  #   POST http://<device-ip>/number/AI%20Helper%20Usage%20Remaining/set?value=<0-100>
  # It's a `number` rather than a `sensor` because ESPHome's web server can only
  # *set* controllable entities over HTTP - `sensor` entities are read-only. It
  # still displays as a 0-100 % readout in the web UI / Home Assistant.
  - platform: template
    id: sem_usage_remaining
    name: ${friendly_name} Usage Remaining
    icon: mdi:battery-clock
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial_value: ${sem_init_usage_remaining}

text:
  # Which tool last pushed the usage percentage. Set over HTTP alongside the
  # percentage, addressing the entity by its URL-encoded display name:
  #   POST http://<device-ip>/text/AI%20Helper%20Usage%20Source/set?value=Claude%20Code
  - platform: template
    id: sem_usage_source
    name: ${friendly_name} Usage Source
    icon: mdi:account-wrench
    entity_category: diagnostic
    optimistic: true
    # Persisted across reboots. ESPHome's template text logs a misleading "too
    # long to save" warning on a no-op (re-writing the same value), so the agent
    # hooks read the current value and only write when it actually changes.
    restore_value: true
    mode: text
    min_length: 0
    max_length: 32
    initial_value: ${sem_init_usage_source}

text_sensor:
  - platform: template
    id: sem_ai_status_text
    name: ${friendly_name} Status Text
    icon: mdi:robot
    update_interval: never

  - platform: template
    id: sem_led_output_mode_text
    name: ${friendly_name} LED Output Mode
    icon: mdi:led-strip-variant
    update_interval: never
