substitutions:
  # Device name
  device_name: jbdbms-gateway-v2
  
  # Hardware
  # IMPORTANT: Make sure to use your JBD BMS MAC address here
  bms_mac_address: !secret bms_mac_address
  relay_control_pin: "14"

  # MQTT defaults
  mqtt_broker: !secret mqtt_broker
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

  # WiFi AP fallback
  ap_ssid: "AP-JBDBMS-Gateway"
  ap_password: "password"
  
  # Timings
  display_on_time: "30s"
  bms_update_interval: "5s"
  
  # Relay limits
  soc_low_limit_percentage: "0.8"
  soc_high_limit_percentage: "0.975"
  soc_low_limit_initial: "160"
  soc_high_limit_initial: "195"

  # "JBD Charging Active" detection: turns on when current >= threshold, turns off
  # only after current stays below the threshold for the whole off delay.
  charging_current_threshold_a: "5.0"
  charging_off_delay_ms: "60000"  # 1 minute

esphome:
  name: ${device_name}
  includes:
    - jbdbms_v2.h
    - panic_capture.h
    - wdt_forensics.h
  # Panic report (no serial in prod): ESPHome's own crash handler (2026.3+) stores the crash
  # site across the reboot; panic_capture.h turns it into the "JBD Last Panic" sensors.
  # Don't add -Wl,--wrap=esp_panic_handler or define __wrap_esp_panic_handler here:
  # ESPHome already does, and a second definition fails at link time.
  # Start the timer when the system boots
  on_boot:
    priority: -100
    then:
      # Report which component the main loop was stuck in, and the saved stacks of
      # loopTask and the Bluetooth tasks, if the last reset was a task watchdog
      # (see esp_task_wdt_isr_user_handler in wdt_forensics.h).
      - lambda: |-
          wdt_forensics::load_previous();
          wdt_forensics::refresh_tasks();
          id(wdt_last_report).publish_state(wdt_forensics::last_report());
          id(wdt_loop_trace).publish_state(wdt_forensics::loop_trace());
          id(wdt_bt_host).publish_state(wdt_forensics::task_traces(1, 2));
          id(wdt_bt_hci).publish_state(wdt_forensics::task_traces(3, 4));
      # Report where the last panic happened (exception/abort/any watchdog): reason,
      # crashed core, PC, backtrace addresses. See panic_capture.h for how to decode.
      - lambda: |-
          panic_capture::load_previous();
          id(panic_last_report).publish_state(panic_capture::summary());
          id(panic_last_backtrace).publish_state(panic_capture::backtrace());
          if (panic_capture::summary() != "n/a") {
            ESP_LOGW("panic_capture", "Previous panic: %s", panic_capture::summary().c_str());
            ESP_LOGW("panic_capture", "Backtrace: %s", panic_capture::backtrace().c_str());
          }
      - script.execute: init_soc_limits
      - script.execute: apply_relay_restart_behavior
      - script.execute: apply_relay_soc_rules
      - script.execute: display_timer

preferences:
  flash_write_interval: 30s

esp32:
  board: esp32dev
  framework:
    type: esp-idf # Stable for BLE + WiFi coexistence
    advanced:
        # This unit is an ESP32 rev3.0 (see "ESP32 Chip" in the boot log). Don't raise it:
        # an image needing a newer chip is refused by OTA ("Finishing update failed").
        minimum_chip_revision: "3.0"
        # Main loop task stack (default 8192). Extra headroom for deep lambda/BLE/MQTT
        # call chains (jkbms_v2 measured only ~5 KB free of 8192); it is taken from heap.
        # Check "JBD Loop Stack Free" in HA history before trimming it.
        loop_task_stack_size: 12288
        # Both suggested by the device itself at boot (2026.10): flash vendor driver is
        # GigaDevice, and the running bootloader already supports SRAM1 as IRAM (+40 KB).
        # sram1_as_iram needs that bootloader: don't copy it to a unit that doesn't print the hint.
        flash_chip: gd
        sram1_as_iram: true
    # Post-build hook: after every link the firmware ELF is copied to elf-archive/ as
    # firmware-<date>-<id>.elf, <id> being the "elf=" value of "JBD Last Panic". A panic can
    # only be decoded with the ELF of the build that was running; see elf_archive/.
    # Path is relative to .esphome/build/<device>/src (4 levels up = this folder).
    components:
      - name: elf_archive
        path: ../../../../elf_archive
    sdkconfig_options:
      # Add headroom for occasional heavy loop iterations under RF/network bursts.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
    
ota:
  - platform: esphome

# 1. Connection settings
wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  # Fallback access point if WiFi disappears
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
    
  # Allow saving new credentials to flash memory
  fast_connect: true
  power_save_mode: NONE
  reboot_timeout: 0s
  # Roam scans compete with BLE for the shared 2.4GHz radio and have been
  # observed to cause multi-second esp32_ble stalls leading to task watchdog resets.
  post_connect_roaming: false

# Enables the web interface when in AP mode
captive_portal:

# Simple web server to change settings if already connected
#web_server:
  #port: 80

api: #For Home Assistant
  reboot_timeout: 5min

# MQTT configuration
mqtt:    
  broker: ${mqtt_broker}
  username: ${mqtt_username}
  password: ${mqtt_password}
  port: 1883
  topic_prefix: jbdbms # Changed prefix for JBD
  # HA gets its entities from the native API and IoT MQTT Panel reads plain
  # topics, so the discovery JSON is not needed. Building it for every entity
  # after each (re)connect ran jkbms_v2 out of heap (panic in
  # MQTTComponent::send_discovery_ -> operator new -> abort). State topics
  # under topic_prefix are unaffected.
  discovery: false
  reboot_timeout: 0s
  # A dead/flapping broker must never stall the main loop. By default every
  # publish runs on the main loop and can block up to the 10 s network
  # timeout (twice, it is retried once), which trips the 30 s task watchdog
  # ("mqtt") and the BLE tracker's scan timeout ("Reboot request from
  # esp32_ble_tracker"). Async hands publishes to a separate task via a
  # queue; when the broker is unreachable messages are dropped, not waited on.
  #idf_send_async: true
  # Don't mirror every log line to MQTT: it is one more publish per line.
  #log_topic:
  keepalive: 30s

# Enable logger
logger:
  level: INFO
  # Feeds panic_capture::load_previous() (on_boot) with the crash handler's ERROR lines.
  on_message:
    level: ERROR
    then:
      - lambda: 'panic_capture::on_log(tag, message);'

# 2. Bluetooth settings
esp32_ble_tracker:
  scan_parameters:
    # Passive scanning improves WiFi coexistence and reduces MQTT/API stalls.
    active: false
  # ESPHome's own WiFi/BLE time-sharing coordination has been a suspect in
  # multi-second esp32_ble stalls (buffer overflow -> MQTT/API disconnects).
  software_coexistence: false

ble_client:
  - mac_address: ${bms_mac_address}
    id: jbd_bms_ble_client

#3. JBD-BMS (XiaoXiang) driver integration
external_components:
  - source: github://syssi/esphome-jbd-bms@main

#My Custom Forked version of the JBD-BMS driver to add some extra features and fixes
# external_components:
#   - source:
#       type: git
#       url: https://github.com/YBalan/esphome-jbd-bms.git
#       ref: main
#     components: [jbd_bms_ble]

jbd_bms_ble:
  - ble_client_id: jbd_bms_ble_client
    id: my_bms
    update_interval: ${bms_update_interval} 

# 3.5 PERSISTED STATE (charging duration and relay restart behavior)
globals:
  # Accumulated seconds of the current (or, once stopped, the last) charging
  # session. Persisted so a reboot mid-charge resumes counting instead of
  # losing the elapsed time.
  - id: bms_charging_duration_s
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  # Captures whether charging was already active at boot from the first
  # available current sample. This avoids misclassifying a later new session
  # as a resume just because a persisted duration exists.
  - id: bms_boot_current_sampled
    type: bool
    restore_value: no
    initial_value: "false"
  - id: bms_charging_was_active_at_boot
    type: bool
    restore_value: no
    initial_value: "false"

  # Persists the relay's latest commanded state so "Last State" can be
  # applied on restart even with a safety-first hardware default at boot.
  - id: bms_relay_last_state
    type: bool
    restore_value: yes
    initial_value: "false"

# 4. SENSORS (Telemetry)
sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: my_bms

    # Total battery capacity setting (read-only from BMS)
    nominal_capacity:
      name: "JBD Total Capacity"
      state_topic: "jbdbms/total_capacity"
      id: bms_total_capacity
      unit_of_measurement: "Ah"
      filters:
        - throttle: 60s

    # Total voltage
    total_voltage:
      name: "JBD Total Voltage"
      state_topic: "jbdbms/voltage"
      id: bms_v
      filters:
        - delta: 0.05
        - throttle: 2s

    # Current
    current:
      name: "JBD Current"
      state_topic: "jbdbms/current"
      id: bms_a
      on_value:
        then:
          - if:
              condition:
                lambda: 'return !id(bms_boot_current_sampled);'
              then:
                - lambda: |-
                    id(bms_charging_was_active_at_boot) = x >= ${charging_current_threshold_a}f;
                    id(bms_boot_current_sampled) = true;
                    ESP_LOGI("charging_duration", "Boot sample captured: current=%.2f A, active_at_boot=%s",
                             x, id(bms_charging_was_active_at_boot) ? "true" : "false");
      filters:
        - delta: 0.1
        - throttle: 2s

    # Charge in Ah (Remaining Capacity)
    capacity_remaining:
      name: "JBD SoC Ah"
      state_topic: "jbdbms/soc"
      id: bms_ah
      on_value:
        then:
          # If the capacity dropped below limit
          - if:
              condition:
                lambda: 'return x < id(soc_low_limit_number).state;'
              then:
                - switch.turn_on: bms_relay                
          # If the capacity rose above limit
          - if:
              condition:
                lambda: 'return x >= id(soc_high_limit_number).state;'
              then:
                - switch.turn_off: bms_relay                
      filters:
        - delta: 0.01
        - throttle: 2s
        
    # Remaining capacity in percentage (%)
    state_of_charge:
      name: "JBD SoC Percentage"
      id: bms_soc_pct
      state_topic: "jbdbms/soc_percent"
      unit_of_measurement: "%"
      device_class: battery
      accuracy_decimals: 0
      filters:
        - delta: 1
        - throttle: 2s
        
    # Power (W)
    power:
      name: "JBD Power"
      state_topic: "jbdbms/power"
      id: bms_power
      filters:
        - delta: 5.0
        - throttle: 2s

    # JBD Temperature sensors (NTC1, NTC2)
    temperature_1:
      name: "JBD Temp 1"
      state_topic: "jbdbms/t1"
      filters: &temp_filter
        - delta: 0.5
        - throttle: 15s
    temperature_2:
      name: "JBD Temp 2"
      state_topic: "jbdbms/t2"
      filters: *temp_filter  

    # JBD Charging Cycles
    charging_cycles:
      name: "JBD Charging Cycles"      
      state_topic: "jbdbms/cycles"            
      filters:
        # Cycle count is a slowly-changing integer; delta suppressed all updates.
        # Re-emit the current value every 60s so HA always shows a fresh state.
        - heartbeat: 60s

    # Cell voltages (Min/Max)
    min_cell_voltage:
      name: "JBD Min Cell"
      state_topic: "jbdbms/min_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s
        
    max_cell_voltage:
      name: "JBD Max Cell"
      state_topic: "jbdbms/max_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s
        
    # Imbalance (Delta)
    delta_cell_voltage:
      name: "JBD Cell Delta"
      state_topic: "jbdbms/delta"
      filters:
        - delta: 0.002
        - throttle: 5s

    # Crash diagnostics: the device may have no serial access in production, so the
    # last values in Home Assistant history before a "exception/panic" reset are
    # the only evidence. Heap/stack trends separate OOM from stack overflow.
  - platform: debug
    free:
      name: "JBD Heap Free"
    block:
      name: "JBD Heap Largest Block"
    min_free:
      name: "JBD Heap Min Free"      # lowest free heap since boot
    fragmentation:
      name: "JBD Heap Fragmentation"
    loop_time:
      name: "JBD Loop Max Time"      # longest main-loop iteration per interval

  - platform: uptime
    name: "JBD Uptime"
    entity_category: diagnostic

  # Unused stack of the main loop task. Low values (< ~500 B) point to a
  # stack overflow; the lambda runs on that task, so it measures the right one.
  - platform: template
    name: "JBD Loop Stack Free"
    id: loop_stack_free
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return (float) uxTaskGetStackHighWaterMark(nullptr);

  # Wi-Fi signal level
  - platform: wifi_signal
    name: "JBD WiFi Signal RSSI"
    id: wifi_rssi
    update_interval: 15s
    state_topic: "jbdbms/wifi_rssi"
    force_update: true

  # Wi-Fi channel number. wifi_info has no channel text sensor, so read it
  # straight off the WiFiComponent.
  - platform: template
    name: "JBD WiFi Channel"
    id: wifi_channel
    icon: "mdi:wifi"
    accuracy_decimals: 0
    update_interval: 15s
    entity_category: diagnostic
    state_topic: "jbdbms/wifi_channel"
    lambda: return wifi::global_wifi_component->get_wifi_channel();

  # Bluetooth (BLE) signal level
  - platform: ble_rssi
    mac_address: ${bms_mac_address}
    name: "JBD BLE RSSI"
    id: ble_rssi_val    
    state_topic: "jbdbms/ble_rssi"
    force_update: true
    filters:
      - filter_out: nan
      - throttle: 15s
      
  # Charging Time Remaining Calculation
  - platform: template
    name: "JBD Charging Time Remaining"
    id: charging_time
    unit_of_measurement: "h"
    state_topic: "jbdbms/charging_time_hours"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      float new_value = jbdbms_lambdas::calculate_charging_time();
      if (id(charging_time).has_state() && new_value == id(charging_time).state) {
        return {};
      }
      return new_value;

   # Split: Positive values for Charging
  - platform: template
    name: "JBD Power Charging"
    id: power_in
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jbdbms_lambdas::get_power_in();

  # Split: Absolute values for Discharging
  - platform: template
    name: "JBD Power Discharging"
    id: power_out
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jbdbms_lambdas::get_power_out();
   # Total Energy Charged (kWh)
  - platform: integration
    name: "JBD Battery Energy In"
    sensor: power_in
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jbdbms/energy_in"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001

  # Total Energy Discharged (kWh)
  - platform: integration
    name: "JBD Battery Energy Out"
    sensor: power_out
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jbdbms/energy_out"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001
            
# 5. STATUSES (Binary Sensors)
binary_sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: my_bms
    # JBD specific status bits
    charging:
      name: "JBD Charging State"
      state_topic: "jbdbms/status/charging"
    discharging:
      name: "JBD Discharging State"
      state_topic: "jbdbms/status/discharging"
    balancing:
      name: "JBD Balancing State"
      state_topic: "jbdbms/status/balancing"
      
  # Physical BOOT button to wake display
  - platform: gpio
    pin:
      number: 0
      inverted: true
      mode: INPUT_PULLUP
    id: boot_button
    on_press:
      - script.execute: display_timer

  # The BMS's own "charging" flag reflects MOSFET enable and can remain true
  # near idle current. Duration tracking is based on actual current instead.
  # Logic lives in jbdbms_v2.h.
  - platform: template
    name: "JBD Charging Active"
    id: bms_charging_active
    device_class: battery_charging
    lambda: |-
      return jbdbms_lambdas::is_charging_active(${charging_current_threshold_a}f, ${charging_off_delay_ms});
    on_press:
      - lambda: |-
          jbdbms_lambdas::on_charging_started();
    on_release:
      - lambda: |-
          jbdbms_lambdas::on_charging_stopped();
      - component.update: bms_charging_duration_formatted

# Accumulates the persisted charging-duration counter while charging is active.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(bms_charging_active).state) {
            id(bms_charging_duration_s) += 10;
          }

  # Re-resolve the task handles the task-watchdog hook reads (the Bluetooth tasks only
  # exist once Bluetooth is up, which can be a while after boot). Must run in task
  # context, not in the interrupt. Cheap: five name lookups.
  - interval: 10s
    then:
      - lambda: 'wdt_forensics::refresh_tasks();'

  # Refresh the OLED once a second, but only while it is lit (see display block).
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(my_display).is_on();'
          then:
            - component.update: my_display

button:
    # Factory reset: wipes all stored preferences and reboots.
  - platform: factory_reset
    name: "JBD Factory Reset"
    id: factory_reset_btn
    icon: "mdi:cog-counterclockwise"

    # Forget only the saved WiFi credentials and reboot; on restart the device
    # falls back to its own AP + captive portal (${ap_ssid}) for a new network.
    # Other preferences are kept, so this is NOT a factory reset.
  - platform: template
    name: "JBD WiFi Forget"
    id: wifi_forget_btn
    entity_category: config
    icon: "mdi:wifi-remove"
    on_press:
      - logger.log: "Forgetting WiFi credentials; rebooting into setup AP"
      - lambda: |-
          // save_wifi_sta persists the empty credentials to NVS immediately.
          wifi::global_wifi_component->save_wifi_sta("", "");
      - delay: 1s
      - lambda: "App.safe_reboot();"

  - platform: restart
    name: "JBD Restart Device"
    id: restart_btn
    icon: "mdi:restart"

    # One-off checks of the panic capture. Disabled in HA until you enable the
    # entity; pressing one crashes and reboots the device on purpose. After the
    # reboot "JBD Last Panic" and "JBD Last Panic Backtrace" must be filled in.
  - platform: template
    name: "JBD Test Panic (abort)"
    id: test_panic_abort_btn
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:bug-outline"
    on_press:
      - lambda: "abort();"

  - platform: template
    name: "JBD Test Panic (fault)"
    id: test_panic_fault_btn
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:bug-outline"
    on_press:
      - lambda: "*(volatile int *) 0 = 1;"

    # Blocks the main loop for 40 s (the task watchdog fires after 30 s) to check the
    # watchdog stack capture: after the reset "JBD Last Watchdog Backtrace" must show
    # vTaskDelay / delay on top of a call chain from this button. The relay and the BMS
    # polling are not serviced during the test; the device resets by itself.
  - platform: template
    name: "JBD Test Watchdog (block loop)"
    id: test_wdt_block_btn
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:bug-outline"
    on_press:
      - lambda: |-
          wdt_forensics::refresh_tasks();
          esphome::delay(40000);

# 6. CONTROL (Switches)
switch:
  # Physical relay on pin 14
  - platform: gpio
    pin: ${relay_control_pin}
    name: "JBD Control Relay"
    id: bms_relay
    restore_mode: ALWAYS_OFF
    state_topic: "jbdbms/relay/state"
    command_topic: "jbdbms/relay/set"    
    on_turn_on:
      - lambda: |-
          id(bms_relay_last_state) = true;
      - output.turn_on: blue_led_out
    on_turn_off:
      - lambda: |-
          id(bms_relay_last_state) = false;
      - output.turn_off: blue_led_out
    
  # JBD Internal MOSFET Switches
  - platform: jbd_bms_ble
    jbd_bms_ble_id: my_bms
    charging:
      name: "JBD Charging Switch"
      state_topic: "jbdbms/switch/charge/state"
      command_topic: "jbdbms/switch/charge/set"
    discharging:
      name: "JBD Discharging Switch"
      state_topic: "jbdbms/switch/discharge/state"
      command_topic: "jbdbms/switch/discharge/set"

# 6.5 CONFIGURABLE NUMBERS (SOC Limits)
select:
  - platform: template
    name: "JBD Relay Restart Behavior"
    id: relay_restart_behavior
    entity_category: config
    icon: "mdi:restart-alert"
    optimistic: true
    restore_value: true
    initial_option: "Last State"
    options:
      - "Always OFF"
      - "Always ON"
      - "Last State"
    set_action:
      then:
        - lambda: |-
            id(relay_restart_behavior).publish_state(x);
            ESP_LOGI("relay_boot", "Restart behavior set to: %s", x.c_str());

number:
  - platform: template
    name: "JBD SoC Low Limit (Ah)"
    id: soc_low_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    mode: box
    optimistic: true
    restore_value: yes
    initial_value: ${soc_low_limit_initial}
    set_action:
      then:
        - lambda: |-
            jbdbms_lambdas::set_soc_low_limit(x);
        - script.execute: apply_relay_soc_rules

  - platform: template
    name: "JBD SoC High Limit (Ah)"
    id: soc_high_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    mode: box
    optimistic: true
    restore_value: yes
    initial_value: ${soc_high_limit_initial}
    set_action:
      then:
        - lambda: |-
            jbdbms_lambdas::set_soc_high_limit(x);
        - script.execute: apply_relay_soc_rules

# Internal Blue LED
output:
  - platform: gpio
    pin: 2
    id: blue_led_out

# Surfaces the last reset reason (e.g. "Task watchdog", "Brownout", "Software")
# and free heap on boot + periodically, so reboots are diagnosable.
debug:
  update_interval: 30s  

# 7. DIAGNOSTICS (Text Sensors)
text_sensor:
  - platform: jbd_bms_ble
    jbd_bms_ble_id: my_bms
    errors:
      name: "JBD Errors"
      id: bms_errors
      state_topic: "jbdbms/errors"
      filters:
        - lambda: |-
            if (id(bms_errors).has_state() && x == id(bms_errors).state) {
              return {};
            }
            return x;

  - platform: template
    name: "JBD Charging Time Formatted"
    id: charging_time_formatted
    state_topic: "jbdbms/charging_time_human"
    update_interval: 10s
    lambda: |-
      std::string new_value = jbdbms_lambdas::format_charging_time(id(charging_time).state);
      if (id(charging_time_formatted).has_state() && new_value == id(charging_time_formatted).state) {
        return {};
      }
      return new_value;

  # Current charging session duration (h m). Keeps counting across a reboot
  # that happens mid-charge, and freezes at the final value when charging
  # stops (see bms_charging_duration_s global and JBD Charging Active logic).
  - platform: template
    name: "JBD Charging Duration"
    id: bms_charging_duration_formatted
    state_topic: "jbdbms/charging_duration_current"
    update_interval: 10s
    lambda: |-
      return {jbdbms_lambdas::format_duration_hm(id(bms_charging_duration_s))};

  - platform: debug
    reset_reason:
      name: "JBD Reset Reason"
  # Component the main loop was running when the task watchdog fired, with the
  # uptime at that moment. "n/a" when the last reset was not a task watchdog.
  - platform: template
    name: "JBD Last Watchdog"
    id: wdt_last_report
    entity_category: diagnostic
    icon: "mdi:dog"
  # Saved call stack of loopTask when the task watchdog fired: "elf=<id> stack: 0x...", top
  # frame first. The panic backtrace shows the idle task; this shows where the main loop
  # was waiting. Decode with tools/decode_panic.py (paste this text; the ELF is picked by
  # the id). Checked on the device with "JBD Test Watchdog (block loop)".
  - platform: template
    name: "JBD Last Watchdog Backtrace"
    id: wdt_loop_trace
    entity_category: diagnostic
    icon: "mdi:format-list-numbered"
  # Same for the Bluetooth tasks, "BTC_TASK: 0x... | BTU_TASK: 0x...". Healthy tasks wait on
  # their own queue/semaphore (osi_sem_take, xQueueReceive); one waiting on something else
  # is the one that stopped draining. Two sensors: the host tasks, then HCI + controller.
  - platform: template
    name: "JBD Last Watchdog BT Host Tasks"
    id: wdt_bt_host
    entity_category: diagnostic
    icon: "mdi:bluetooth"
  - platform: template
    name: "JBD Last Watchdog BT HCI Tasks"
    id: wdt_bt_hci
    entity_category: diagnostic
    icon: "mdi:bluetooth"
  # Where the last panic happened: reason (Fault/Abort/Task wdt/Interrupt wdt), crashed
  # core, PC, fault address and the id of the running ELF. "n/a" after a reset that was
  # not a panic.
  - platform: template
    name: "JBD Last Panic"
    id: panic_last_report
    entity_category: diagnostic
    icon: "mdi:bug"
  # Code addresses of the last panic's call stack. Decode on a PC with
  # tools/decode_panic.py against the firmware.elf that was flashed.
  - platform: template
    name: "JBD Last Panic Backtrace"
    id: panic_last_backtrace
    entity_category: diagnostic
    icon: "mdi:format-list-numbered"
  # Exposes the name (SSID) of the WiFi network the device is connected to,
  # so you can confirm which network it joined without checking the router.
  - platform: wifi_info
    ssid:
      name: JBD WiFi Name
      id: wifi_ssid
      entity_category: diagnostic
      
# Timer script for OLED
script:
  - id: init_soc_limits
    then:
      - wait_until:
          condition:
            lambda: 'return id(bms_total_capacity).has_state();'
          timeout: 30s
      - lambda: |-
          jbdbms_lambdas::init_soc_limits(${soc_low_limit_initial}, ${soc_high_limit_initial}, ${soc_low_limit_percentage}, ${soc_high_limit_percentage});

  - id: apply_relay_restart_behavior
    then:
      - lambda: |-
          const std::string mode = id(relay_restart_behavior).current_option();
          ESP_LOGI("relay_boot", "Applying relay restart behavior: %s", mode.c_str());
      - if:
          condition:
            lambda: 'return id(relay_restart_behavior).current_option() == "Always ON";'
          then:
            - switch.turn_on: bms_relay
          else:
            - if:
                condition:
                  lambda: 'return id(relay_restart_behavior).current_option() == "Always OFF";'
                then:
                  - switch.turn_off: bms_relay
                else:
                  - if:
                      condition:
                        lambda: 'return id(bms_relay_last_state);'
                      then:
                        - switch.turn_on: bms_relay
                      else:
                        - switch.turn_off: bms_relay

  - id: apply_relay_soc_rules
    then:
      - wait_until:
          condition:
            lambda: 'return id(bms_ah).has_state();'
          timeout: 45s
      - lambda: |-
          if (!id(bms_ah).has_state()) {
            ESP_LOGW("relay_soc", "SOC state not available yet; skipping relay SOC-rule sync");
            return;
          }
          const float soc = id(bms_ah).state;
          const float low = id(soc_low_limit_number).state;
          const float high = id(soc_high_limit_number).state;
          if (soc < low) {
            id(bms_relay).turn_on();
            ESP_LOGI("relay_soc", "SOC %.2f < low %.2f -> relay ON", soc, low);
          } else if (soc >= high) {
            id(bms_relay).turn_off();
            ESP_LOGI("relay_soc", "SOC %.2f >= high %.2f -> relay OFF", soc, high);
          } else {
            ESP_LOGI("relay_soc", "SOC %.2f within [%.2f, %.2f) -> keep current relay state", soc, low, high);
          }

  - id: display_timer
    mode: restart
    then:
      - lambda: 'id(my_display).turn_on();'
      - delay: ${display_on_time}
      - lambda: 'id(my_display).turn_off();'

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

i2c:
  sda: 21
  scl: 22
  scan: true 

# OLED Display Configuration
display:
  - platform: ssd1306_i2c
    id: my_display
    model: "SSD1306 128x64"
    address: 0x3C
    setup_priority: -100
    # No polling: SSD1306::update() flushes the whole 1 KB buffer over I2C
    # (~0.2 s of blocked main loop at the default 50 kHz) even when the panel
    # is off. Redraws are driven by a 1 s `interval:` (see above), only while
    # the screen is on. Don't call component.update from the boot script: it
    # could run before this display's setup() has allocated its buffer.
    update_interval: never
    lambda: |-
      // Screen is off: draw nothing.
      if (!id(my_display).is_on()) {
        return;
      }
      it.printf(0, 0, id(font_small), "JBD-BMS");
      if (id(wifi_rssi).has_state()) {
        it.printf(127, 0, id(font_small), TextAlign::TOP_RIGHT, "%.0fdBm", id(wifi_rssi).state);
      }
      it.line(0, 13, 128, 13);
      if (id(bms_v).has_state()) {
        it.printf(0, 15, id(font_large), "%.2f V", id(bms_v).state);
      }
      if (id(bms_a).has_state()) {
        it.printf(0, 38, id(font_small), "Current: %.2f A", id(bms_a).state);
      }
      if (id(bms_ah).has_state()) {
        it.printf(0, 50, id(font_small), "Cap: %.1f Ah", id(bms_ah).state);
      }