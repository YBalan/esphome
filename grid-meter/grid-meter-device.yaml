substitutions:
  device_name: grid-meter
  friendly_name: Grid Meter
  ap_ssid: AP-Grid-Meter
  ap_password: password
  time_zone: Europe/Kyiv
  wifi_rssi_update: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - grid-meter-pzem.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
        minimum_chip_revision: "3.0"
        # Both suggested by this unit at boot (2026.10): its flash works with the generic
        # driver (units differ, jbdbms_v2 is "gd"), and its bootloader already supports
        # SRAM1 as IRAM (+40 KB). Copy neither to a unit that doesn't print the same hint.
        flash_chip: generic
        sram1_as_iram: true
    sdkconfig_options:
        # Add headroom for occasional heavy loop iterations under RF/network bursts.
        CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

packages:
  common: !include grid-meter-common.yaml
  pzem: !include grid-meter-pzem.yaml

api:
