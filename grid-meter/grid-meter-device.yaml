substitutions:
  device_name: grid-meter
  friendly_name: Grid Meter
  ap_ssid: AP-Grid-Meter
  ap_password: password
  time_zone: Europe/Kyiv
  wifi_rssi_update: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - grid-meter-pzem.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
        minimum_chip_revision: "3.1"
    sdkconfig_options:
        # Add headroom for occasional heavy loop iterations under RF/network bursts.
        CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

packages:
  common: !include grid-meter-common.yaml
  pzem: !include grid-meter-pzem.yaml

api:
