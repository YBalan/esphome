substitutions:
  # Device name
  device_name: jkbms-gateway-v2
  
  # Hardware
  bms_mac_address: !secret bms_mac_address
  relay_control_pin: "14"

  # MQTT defaults
  mqtt_broker: !secret mqtt_broker
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

  # WiFi AP fallback
  ap_ssid: "AP-JKBMS-Gateway"
  ap_password: "password"
  
  # Timings
  display_on_time: "30s"
  bms_update_interval: "5s"
  
  # SOC limit percentages (configurable limits are calculated from total_capacity)
  soc_low_limit_percentage: "0.8"   # 80% of total capacity
  soc_high_limit_percentage: "0.99"  # 99% of total capacity
  # Initial values for 314 Ah battery (314 * 0.8 = 251.2, 314 * 0.99 = 310.86)
  soc_low_limit_initial: "251"
  soc_high_limit_initial: "311"

esphome:
  name: ${device_name}
  includes:
    - jkbms_v2.h
  # Start the timer and initialize SOC limits when the system boots
  on_boot:
    priority: -100 # Run last, when everything has already finished loading
    then:
      - script.execute: init_soc_limits
      - script.execute: apply_relay_restart_behavior
      - script.execute: apply_relay_soc_rules
      - script.execute: display_timer

preferences:
  # Persist restored number values soon after changes (avoids loss after reboot)
  flash_write_interval: 30s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
ota:
  - platform: esphome

# 1. Connection settings
wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  # Fallback access point if WiFi disappears
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
    
  # Allow saving new credentials to flash memory
  fast_connect: true

# Enables the web interface when in AP mode
captive_portal:

# Simple web server to change settings if already connected
#web_server:
  #port: 80

api: #For Home Assistant
  reboot_timeout: 5min  

# MQTT configuration (fill in your broker details)
mqtt:    
  broker: ${mqtt_broker}
  username: ${mqtt_username}
  password: ${mqtt_password}
  port: 1883
  topic_prefix: jkbms
  discovery: true
  #level: NONE
  reboot_timeout: 0s
  #keepalive: 60s
  # If you use HiveMQ Cloud (port 8883), add: certificate_authority: ...

# Enable logger
logger:
  level: INFO

# 2. Bluetooth settings
esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: ${bms_mac_address}
    id: jkbms_ble

# 3. JK-BMS driver integration
external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: jkbms_ble
    id: my_bms
    update_interval: ${bms_update_interval}
    protocol_version: JK02_32S

# 3.5 PERSISTED STATE (charging duration tracking)
globals:
  # Accumulated seconds of the current (or, once stopped, the last) charging
  # session. Persisted so a reboot mid-charge resumes counting instead of
  # losing the elapsed time.
  - id: bms_charging_duration_s
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  # Captures whether charging was already active at boot from the first
  # available current sample. This avoids misclassifying a later new session
  # as a resume just because a persisted duration exists.
  - id: bms_boot_current_sampled
    type: bool
    restore_value: no
    initial_value: "false"
  - id: bms_charging_was_active_at_boot
    type: bool
    restore_value: no
    initial_value: "false"

  # Persists the relay's latest commanded state so "Last State" can be
  # applied on restart even with a safety-first hardware default at boot.
  - id: bms_relay_last_state
    type: bool
    restore_value: yes
    initial_value: "false"

# 4. SENSORS (Telemetry)
sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms

    # Total battery capacity setting
    full_charge_capacity:
      name: "BMS Total Capacity"
      state_topic: "jkbms/total_capacity"
      id: bms_total_capacity
      unit_of_measurement: "Ah"
      filters:
        - throttle: 60s

    # Total voltage: publish if it changed by 0.05V, but not more often than once every 2 seconds
    total_voltage:
      name: "BMS Total Voltage"
      state_topic: "jkbms/voltage"
      id: bms_v
      filters:
        - delta: 0.05
        - throttle: 2s

    # Current: publish if it changed by 0.1A
    current:
      name: "BMS Current"
      state_topic: "jkbms/current"
      id: bms_a
      on_value:
        then:
          - if:
              condition:
                lambda: 'return !id(bms_boot_current_sampled);'
              then:
                - lambda: |-
                    id(bms_charging_was_active_at_boot) = x >= 5.0f;
                    id(bms_boot_current_sampled) = true;
                    ESP_LOGI("charging_duration", "Boot sample captured: current=%.2f A, active_at_boot=%s",
                             x, id(bms_charging_was_active_at_boot) ? "true" : "false");
      filters:
        - delta: 0.1
        - throttle: 2s

    # Charge in Ah: publish only if it changed by 0.01 or once every 2 seconds
    capacity_remaining:
      name: "BMS SoC"
      state_topic: "jkbms/soc"
      id: bms_ah
      on_value:
        then:
          # If the capacity dropped below soc_low_limit
          - if:
              condition:
                lambda: 'return id(relay_control_logic_enabled).state && x < id(soc_low_limit_number).state;'
              then:
                - switch.turn_on: bms_relay                
          # If the capacity rose to soc_high_limit and above
          - if:
              condition:
                lambda: 'return id(relay_control_logic_enabled).state && x >= id(soc_high_limit_number).state;'
              then:
                - switch.turn_off: bms_relay                
      filters:
        - delta: 0.01
        - throttle: 2s
        
    # Remaining capacity in percentage (%)
    state_of_charge:
      name: "BMS SoC Percentage"
      id: bms_soc_pct
      state_topic: "jkbms/soc_percent"
      unit_of_measurement: "%"
      device_class: battery
      accuracy_decimals: 0
      filters:
        - delta: 1
        - throttle: 2s
        
    total_charging_cycle_capacity:
      name: "BMS Cycle Capacity"      
      state_topic: "jkbms/cycle_capacity"
      filters:
        - delta: 1
        - throttle: 60s

    # Power (W)
    power:
      name: "BMS Power"
      state_topic: "jkbms/power"
      id: bms_power
      filters:
        - delta: 5.0
        - throttle: 2s    

    # Temperatures: publish if they changed by 0.5 degrees or once per minute
    temperature_sensor_1:
      name: "BMS Temp 1"
      state_topic: "jkbms/t1"
      filters: &temp_filter
        - delta: 0.5
        - throttle: 15s
    temperature_sensor_2:
      name: "BMS Temp 2"
      state_topic: "jkbms/t2"
      filters: *temp_filter  
    temperature_sensor_5:
      name: "BMS MOSFET Temperature"      
      state_topic: "jkbms/mos_temp"
      filters: *temp_filter

    # Cells: the most important part. Publish if it changed by 0.01V
    min_cell_voltage:
      name: "Min Cell"
      state_topic: "jkbms/min_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s
        
    max_cell_voltage:
      name: "Max Cell"
      state_topic: "jkbms/max_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s

    # Imbalance (Delta)
    delta_cell_voltage:
      name: "BMS Cell Delta"
      state_topic: "jkbms/delta"
      filters:
        - delta: 0.002
        - throttle: 5s
        
    # BMS Charging Cycles
    charging_cycles:
      name: "BMS Charging Cycles"
      id: bms_cycles
      state_topic: "jkbms/cycles"
      filters:
        # Cycle count is a slowly-changing integer; delta suppressed all updates.
        # Re-emit the current value every 60s so HA always shows a fresh state.
        - heartbeat: 60s
        
    # Wi-Fi signal level
  - platform: wifi_signal
    name: "WiFi Signal RSSI"
    id: wifi_rssi
    update_interval: 15s
    state_topic: "jkbms/wifi_rssi"
    force_update: true

  # Bluetooth (BLE) signal level from the BMS
  - platform: ble_rssi
    mac_address: ${bms_mac_address}
    name: "BMS BLE RSSI"
    id: ble_rssi_val    
    state_topic: "jkbms/ble_rssi"
    force_update: true
    filters:
      - filter_out: nan
      - throttle: 15s # Skip values more often than once every 15 seconds
      
  - platform: template
    name: "Charging Time Remaining"
    id: charging_time
    unit_of_measurement: "h"
    state_topic: "jkbms/charging_time_hours"
    accuracy_decimals: 1
    update_interval: 10s # No need to calculate too often
    lambda: |-
      return jkbms_lambdas::calculate_charging_time();
      
  # Split: Positive values for Charging
  - platform: template
    name: "Power Charging"
    id: power_in
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jkbms_lambdas::get_power_in();

  # Split: Absolute values for Discharging
  - platform: template
    name: "Power Discharging"
    id: power_out
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jkbms_lambdas::get_power_out();
   # Total Energy Charged (kWh)
  - platform: integration
    name: "Battery Energy In"
    sensor: power_in
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jkbms/energy_in"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001

  # Total Energy Discharged (kWh)
  - platform: integration
    name: "Battery Energy Out"
    sensor: power_out
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jkbms/energy_out"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001
      
# 5. STATUSES (Binary Sensors)
binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms
    charging:
      name: "BMS Charging State"
      state_topic: "jkbms/status/charging"
    discharging:
      name: "BMS Discharging State"
      state_topic: "jkbms/status/discharging"
    balancing:
      name: "BMS Balancing State"
      state_topic: "jkbms/status/balancing"

    # GPIO button 0 (Builtin button "Boot" to wake dislay)
  - platform: gpio
    pin:
      number: 0
      inverted: true
      mode: INPUT_PULLUP
    id: wake_button
    on_press:
      - script.execute: display_timer

  # The BMS's own "charging" flag reflects the charge MOSFET/switch enable
  # bit, which can stay true with near-zero current (charger disconnected,
  # battery topped off, CV tail end). Duration tracking needs actual current
  # flow, so gate it on current instead.
  - platform: template
    name: "BMS Charging Active"
    id: bms_charging_active
    device_class: battery_charging
    lambda: |-
      // Add hysteresis so current noise near the threshold does not retrigger
      // on_press/on_release and accidentally reset an active charging session.
      static bool active = false;
      if (!id(bms_a).has_state()) {
        return false;
      }
      const float current_a = id(bms_a).state;
      if (!active && current_a >= 7.0f) {
        active = true;
      } else if (active && current_a <= 5.0f) {
        active = false;
      }
      return active;
    on_press:
      - lambda: |-
          // 'first_edge' is a RAM-only static, not an ESPHome global, so it
          // is always true again after a real reboot - unlike a persisted
          // flag it can never get stuck true from an earlier session.
          // First edge after boot:
          // - if charging was already active at boot -> resume (do not reset)
          // - otherwise -> this is a new session (reset to 0)
          // Later edges are always new sessions and must reset.
          static bool first_edge = true;
          const bool was_first_edge = first_edge;
          const bool resuming = was_first_edge && id(bms_charging_was_active_at_boot);
          if (!resuming) {
            id(bms_charging_duration_s) = 0;
          }
          first_edge = false;
          ESP_LOGI("charging_duration", "on_press fired (current=%.2f A), first_edge=%s, active_at_boot=%s, resuming=%s, duration=%u s",
                   id(bms_a).state,
                   was_first_edge ? "true" : "false",
                   id(bms_charging_was_active_at_boot) ? "true" : "false",
                   resuming ? "true" : "false",
                   id(bms_charging_duration_s));
    on_release:
      - lambda: |-
          ESP_LOGI("charging_duration", "on_release fired (current=%.2f A), duration frozen at %u s",
                   id(bms_a).state, id(bms_charging_duration_s));
      - component.update: bms_charging_duration_formatted

# Accumulates the persisted charging-duration counter while charging is active.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(bms_charging_active).state) {
            id(bms_charging_duration_s) += 10;
          }

button:
    # Factory reset: wipes all stored preferences and reboots.
  - platform: factory_reset
    name: "BMS Factory Reset"
    id: factory_reset_btn
    icon: "mdi:cog-counterclockwise"

    # Forget only the saved WiFi credentials and reboot; on restart the device
    # falls back to its own AP + captive portal (${ap_ssid}) for a new network.
    # Other preferences are kept, so this is NOT a factory reset.
  - platform: template
    name: "BMS WiFi Forget"
    id: wifi_forget_btn
    entity_category: config
    icon: "mdi:wifi-remove"
    on_press:
      - logger.log: "Forgetting WiFi credentials; rebooting into setup AP"
      - lambda: |-
          // save_wifi_sta persists the empty credentials to NVS immediately.
          wifi::global_wifi_component->save_wifi_sta("", "");
      - delay: 1s
      - lambda: "App.safe_reboot();"

  - platform: restart
    name: "BMS Restart Device"
    id: restart_btn
    icon: "mdi:restart"

# 6. CONTROL (Switches)
# Allow turning charge/discharge on/off via MQTT
switch:
# Power relay on pin ${relay_control_pin}
  - platform: gpio
    pin: ${relay_control_pin}
    name: "BMS Control Relay"
    id: bms_relay
    restore_mode: ALWAYS_OFF # On boot the relay is always off
      # MQTT settings:
    state_topic: "jkbms/relay/state"      # The phone will see the status here
    command_topic: "jkbms/relay/set"    # The phone will send ON/OFF here    
    # Tie the blue LED to the relay state
    on_turn_on:
      - lambda: |-
          id(bms_relay_last_state) = true;
      - output.turn_on: blue_led_out
    on_turn_off:
      - lambda: |-
          id(bms_relay_last_state) = false;
      - output.turn_off: blue_led_out

  - platform: template
    name: "BMS Control Relay Logic"
    id: relay_control_logic_enabled
    entity_category: config
    icon: "mdi:transistor"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "Control relay logic enabled"
      - script.execute: apply_relay_soc_rules
    turn_off_action:
      - logger.log: "Control relay logic disabled; relay state will remain unchanged"
    
  # JKBMS Switches
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms
    charging:
      name: "BMS Charging Switch"
      state_topic: "jkbms/switch/charge/state"
      command_topic: "jkbms/switch/charge/set"
    discharging:
      name: "BMS Discharging Switch"
      state_topic: "jkbms/switch/discharge/state"
      command_topic: "jkbms/switch/discharge/set"
    balancer:
      name: "BMS Balancer Switch"
      state_topic: "jkbms/switch/balance/state"
      command_topic: "jkbms/switch/balance/set"

# 6.5 CONFIGURABLE NUMBERS (SOC Limits)
# These are storable, configurable via MQTT and Home Assistant
# MQTT discovery is automatic via ESPHome API
select:
  - platform: template
    name: "BMS Relay Restart Behavior"
    id: relay_restart_behavior
    entity_category: config
    icon: "mdi:restart-alert"
    optimistic: true
    restore_value: true
    initial_option: "Last State"
    options:
      - "Always OFF"
      - "Always ON"
      - "Last State"
    set_action:
      then:
        - lambda: |-
            id(relay_restart_behavior).publish_state(x);
            ESP_LOGI("relay_boot", "Restart behavior set to: %s", x.c_str());

number:
  - platform: template
    name: "BMS SoC Low Limit (Ah)"
    id: soc_low_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    device_class: energy
    mode: box
    optimistic: true
    restore_value: yes
    # Default value: total_capacity * soc_low_limit_percentage = total_capacity * 0.6 (60%)
    initial_value: ${soc_low_limit_initial}
    set_action:
      then:
        - lambda: |-
            const float rounded_x = roundf(x);
            id(soc_low_limit_number).publish_state(rounded_x);
            jkbms_lambdas::log_soc_limit_change("SOC Low Limit", rounded_x);
        - script.execute: apply_relay_soc_rules
    
  - platform: template
    name: "BMS SoC High Limit (Ah)"
    id: soc_high_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    device_class: energy
    mode: box
    optimistic: true
    restore_value: yes
    # Default value: total_capacity * soc_high_limit_percentage = total_capacity * 0.99 (99%)
    initial_value: ${soc_high_limit_initial}
    set_action:
      then:
        - lambda: |-
            const float rounded_x = roundf(x);
            id(soc_high_limit_number).publish_state(rounded_x);
            jkbms_lambdas::log_soc_limit_change("SOC High Limit", rounded_x);
        - script.execute: apply_relay_soc_rules

# 6.6 TEXT CONFIG (editable in Home Assistant, persisted)
# Note: BLE MAC and MQTT connection fields in ESPHome are compile-time settings.
# Changes here are stored for convenience and can be used as next-build defaults.
text:
  - platform: template
    name: "BMS MAC Address Config"
    id: bms_mac_address_config
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${bms_mac_address}
    set_action:
      then:
        - lambda: |-
            id(bms_mac_address_config).publish_state(x);
            ESP_LOGI("cfg", "BMS MAC config saved: %s (applies after rebuild/reflash)", x.c_str());

  - platform: template
    name: "MQTT Broker Config"
    id: mqtt_broker_config
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${mqtt_broker}
    set_action:
      then:
        - lambda: |-
            id(mqtt_broker_config).publish_state(x);
            ESP_LOGI("cfg", "MQTT broker config saved: %s (applies after rebuild/reflash)", x.c_str());

  - platform: template
    name: "MQTT Username Config"
    id: mqtt_username_config
    mode: text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${mqtt_username}
    set_action:
      then:
        - lambda: |-
            id(mqtt_username_config).publish_state(x);
            ESP_LOGI("cfg", "MQTT username config saved (applies after rebuild/reflash)");

  - platform: template
    name: "MQTT Password Config"
    id: mqtt_password_config
    mode: password
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${mqtt_password}
    set_action:
      then:
        - lambda: |-
            id(mqtt_password_config).publish_state(x);
            ESP_LOGI("cfg", "MQTT password config saved (applies after rebuild/reflash)");
      
# Describe the LED as a simple output, so we don't create extra buttons in MQTT
output:
  - platform: gpio
    pin: 2
    id: blue_led_out

# Surfaces the last reset reason (e.g. "Task watchdog", "Brownout", "Software")
# and free heap on boot + periodically, so reboots are diagnosable.
debug:
  update_interval: 30s     

# 7. DIAGNOSTICS
text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms
    errors:
      name: "BMS Errors"
      state_topic: "jkbms/errors"
  # Charging Time
  - platform: template
    name: "BMS Charging Time Formatted"
    state_topic: "jkbms/charging_time_human"
    update_interval: 10s
    lambda: |-
      return {jkbms_lambdas::format_charging_time(id(charging_time).state)};
  # Current charging session duration (h m). Keeps counting across a
  # reboot that happens mid-charge, and freezes at the final value when
  # charging stops (see bms_charging_duration_s global and the
  # BMS Charging Active binary_sensor's on_press/on_release above).
  - platform: template
    name: "BMS Charging Duration"
    id: bms_charging_duration_formatted
    state_topic: "jkbms/charging_duration_current"
    update_interval: 10s
    lambda: |-
      return {jkbms_lambdas::format_duration_hm(id(bms_charging_duration_s))};
  - platform: debug
    reset_reason:
      name: BMS Reset Reason
  # Exposes the name (SSID) of the WiFi network the device is connected to,
  # so you can confirm which network it joined without checking the router.
  - platform: wifi_info
    ssid:
      name: "BMS WiFi Name"
      id: wifi_ssid
      entity_category: diagnostic
      
# 1. Timer script (controls how long it stays lit)
script:
  # Initialize SOC limits based on actual BMS total capacity
  # Only initializes if limits haven't been manually changed by the user
  - id: init_soc_limits
    then:
      - wait_until:
          condition:
            lambda: 'return id(bms_total_capacity).has_state();'
          timeout: 30s
      - lambda: |-
          jkbms_lambdas::init_soc_limits(${soc_low_limit_initial}, ${soc_high_limit_initial}, ${soc_low_limit_percentage}, ${soc_high_limit_percentage});

  - id: apply_relay_restart_behavior
    then:
      - if:
          condition:
            switch.is_on: relay_control_logic_enabled
          then:
            - lambda: |-
                const std::string mode = id(relay_restart_behavior).current_option();
                ESP_LOGI("relay_boot", "Applying relay restart behavior: %s", mode.c_str());
            - if:
                condition:
                  lambda: 'return id(relay_restart_behavior).current_option() == "Always ON";'
                then:
                  - switch.turn_on: bms_relay
                else:
                  - if:
                      condition:
                        lambda: 'return id(relay_restart_behavior).current_option() == "Always OFF";'
                      then:
                        - switch.turn_off: bms_relay
                      else:
                        - if:
                            condition:
                              lambda: 'return id(bms_relay_last_state);'
                            then:
                              - switch.turn_on: bms_relay
                            else:
                              - switch.turn_off: bms_relay
          else:
            - logger.log: "Control relay logic disabled; skipping restart behavior"

  - id: apply_relay_soc_rules
    then:
      - if:
          condition:
            switch.is_on: relay_control_logic_enabled
          then:
            - wait_until:
                condition:
                  lambda: 'return id(bms_ah).has_state();'
                timeout: 45s
            - lambda: |-
                if (!id(bms_ah).has_state()) {
                  ESP_LOGW("relay_soc", "SOC state not available yet; skipping relay SOC-rule sync");
                  return;
                }
                const float soc = id(bms_ah).state;
                const float low = id(soc_low_limit_number).state;
                const float high = id(soc_high_limit_number).state;
                if (soc < low) {
                  id(bms_relay).turn_on();
                  ESP_LOGI("relay_soc", "SOC %.2f < low %.2f -> relay ON", soc, low);
                } else if (soc >= high) {
                  id(bms_relay).turn_off();
                  ESP_LOGI("relay_soc", "SOC %.2f >= high %.2f -> relay OFF", soc, high);
                } else {
                  ESP_LOGI("relay_soc", "SOC %.2f within [%.2f, %.2f) -> keep current relay state", soc, low, high);
                }
          else:
            - logger.log: "Control relay logic disabled; skipping SOC-rule sync"

  - id: display_timer
    mode: restart # If you press the button again, the timer resets to the beginning
    then:
      - lambda: 'id(my_display).turn_on();'
      - delay: 30s # How long the screen will stay on
      - lambda: 'id(my_display).turn_off();'

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

i2c:
  sda: 21
  scl: 22
  scan: true # Enable the scanner; it will show the address in the logs

# 3. Display block improvement (add ID)
display:
  - platform: ssd1306_i2c
    id: my_display
    model: "SSD1306 128x64"
    address: 0x3C
    # The screen will be off on boot until the first button press
    setup_priority: -100 
    lambda: |-
      it.printf(0, 0, id(font_small), "JK-BMS MONITOR");
      it.line(0, 13, 128, 13);
      if (id(bms_v).has_state()) {
        it.printf(0, 15, id(font_large), "%.2f V", id(bms_v).state);
      }
      if (id(bms_a).has_state()) {
        it.printf(0, 38, id(font_small), "Current: %.2f A", id(bms_a).state);
      }
      if (id(bms_ah).has_state()) {
        it.printf(0, 50, id(font_small), "Cap: %.1f Ah", id(bms_ah).state);
      }