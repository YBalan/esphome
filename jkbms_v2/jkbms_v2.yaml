substitutions:
  # Device name
  device_name: jkbms-gateway-v2
  
  # Hardware
  bms_mac_address: !secret bms_mac_address
  relay_control_pin: "14"
  grid_sensor_pin: "27"

  # MQTT defaults
  mqtt_broker: !secret mqtt_broker
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password

  # WiFi AP fallback
  ap_ssid: "AP-JKBMS-Gateway"
  ap_password: "password"
  
  # Timings
  display_on_time: "30s"
  bms_update_interval: "5s"
  
  # SOC limit percentages (configurable limits are calculated from total_capacity)
  soc_low_limit_percentage: "0.8"   # 80% of total capacity
  soc_high_limit_percentage: "0.99"  # 99% of total capacity
  # Initial values for 314 Ah battery (314 * 0.8 = 251.2, 314 * 0.99 = 310.86)
  soc_low_limit_initial: "251"
  soc_high_limit_initial: "311"

  # "BMS Charging Active" detection: turns on when current >= threshold, turns off
  # only after current stays below the threshold for the whole off delay.
  charging_current_threshold_a: "7.0"
  charging_off_delay_ms: "60000"  # 1 minute

esphome:
  name: ${device_name}
  includes:
    - jkbms_v2.h
    - panic_capture.h
  # Panic report (no serial in prod): ESPHome's own crash handler (2026.3+) stores the crash
  # site across the reboot; panic_capture.h turns it into the "BMS Last Panic" sensors.
  # Don't add -Wl,--wrap=esp_panic_handler or define __wrap_esp_panic_handler here:
  # ESPHome already does, and a second definition fails at link time.
  # Start the timer and initialize SOC limits when the system boots
  on_boot:
    priority: -100 # Run last, when everything has already finished loading
    then:
      # Report which component the main loop was stuck in if the last reset was
      # a task watchdog (see esp_task_wdt_isr_user_handler in jkbms_v2.h).
      - lambda: |-
          id(wdt_last_report).publish_state(jkbms_wdt::take_last_report());
      # Report where the last panic happened (exception/abort/any watchdog): reason,
      # crashed core, PC, backtrace addresses. See panic_capture.h for how to decode.
      - lambda: |-
          panic_capture::load_previous();
          id(panic_last_report).publish_state(panic_capture::summary());
          id(panic_last_backtrace).publish_state(panic_capture::backtrace());
          if (panic_capture::summary() != "n/a") {
            ESP_LOGW("panic_capture", "Previous panic: %s", panic_capture::summary().c_str());
            ESP_LOGW("panic_capture", "Backtrace: %s", panic_capture::backtrace().c_str());
          }
      - script.execute: init_soc_limits
      - script.execute: apply_relay_restart_behavior
      - script.execute: apply_relay_soc_rules
      - script.execute: display_timer

preferences:
  # Persist restored number values soon after changes (avoids loss after reboot)
  flash_write_interval: 30s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
        # This unit is an ESP32 rev3.0 (see "ESP32 Chip" in the boot log). Don't raise it:
        # an image needing a newer chip is refused by OTA ("Finishing update failed").
        minimum_chip_revision: "3.0"
        # Main loop task stack (default 8192). Measured free was ~5 KB, so this is
        # extra headroom for deep lambda/BLE/MQTT call chains; it is taken from heap.
        loop_task_stack_size: 12288
        # Both suggested by the device itself at boot (2026.10): flash vendor driver is
        # GigaDevice, and the running bootloader already supports SRAM1 as IRAM (+40 KB).
        # sram1_as_iram needs that bootloader: don't copy it to a unit that doesn't print the hint.
        flash_chip: gd
        sram1_as_iram: true
    # Post-build hook: after every link the firmware ELF is copied to elf-archive/ as
    # firmware-<date>-<id>.elf, <id> being the "elf=" value of "BMS Last Panic". A panic can
    # only be decoded with the ELF of the build that was running; see elf_archive/.
    # Path is relative to .esphome/build/<device>/src (4 levels up = this folder).
    components:
      - name: elf_archive
        path: ../../../../elf_archive
    sdkconfig_options:
        # Add headroom for occasional heavy loop iterations under RF/network bursts.
        CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"        
    
ota:
  - platform: esphome

# 1. Connection settings
wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  # Fallback access point if WiFi disappears
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
    
  # Allow saving new credentials to flash memory
  fast_connect: true

# Enables the web interface when in AP mode
captive_portal:

# Simple web server to change settings if already connected
#web_server:
  #port: 80

api: #For Home Assistant
  reboot_timeout: 5min  

# MQTT configuration (fill in your broker details)
mqtt:    
  broker: ${mqtt_broker}
  username: ${mqtt_username}
  password: ${mqtt_password}
  port: 1883
  topic_prefix: jkbms
  # HA gets its entities from the native API and IoT MQTT Panel reads plain
  # topics, so the discovery JSON is not needed. Building it for every entity
  # after each (re)connect ran the device out of heap (panic in
  # MQTTComponent::send_discovery_ -> operator new -> abort). State topics
  # under topic_prefix are unaffected.
  discovery: false
  #level: NONE
  reboot_timeout: 0s
  # A dead/flapping broker must never stall the main loop. By default every
  # publish runs on the main loop and can block up to the 10 s network
  # timeout (twice, it is retried once), which trips the 30 s task watchdog
  # ("mqtt") and the BLE tracker's scan timeout ("Reboot request from
  # esp32_ble_tracker"). Async hands publishes to a separate task via a
  # queue; when the broker is unreachable messages are dropped, not waited on.
  idf_send_async: true
  # Don't mirror every log line to MQTT: it is one more publish per line.
  #log_topic:
  #keepalive: 60s
  # If you use HiveMQ Cloud (port 8883), add: certificate_authority: ...

# Enable logger
logger:
  level: INFO
  # Feeds panic_capture::load_previous() (on_boot) with the crash handler's ERROR lines.
  on_message:
    level: ERROR
    then:
      - lambda: 'panic_capture::on_log(tag, message);'

# 2. Bluetooth settings
esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: ${bms_mac_address}
    id: jkbms_ble

# 3. JK-BMS driver integration
external_components:  
  - source: github://syssi/esphome-jk-bms@main

jk_bms_ble:
  - ble_client_id: jkbms_ble
    id: my_bms
    update_interval: ${bms_update_interval}
    protocol_version: JK02_32S

# 3.5 PERSISTED STATE (charging duration tracking)
globals:
  # Accumulated seconds of the current (or, once stopped, the last) charging
  # session. Persisted so a reboot mid-charge resumes counting instead of
  # losing the elapsed time.
  - id: bms_charging_duration_s
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  # Captures whether charging was already active at boot from the first
  # available current sample. This avoids misclassifying a later new session
  # as a resume just because a persisted duration exists.
  - id: bms_boot_current_sampled
    type: bool
    restore_value: no
    initial_value: "false"
  - id: bms_charging_was_active_at_boot
    type: bool
    restore_value: no
    initial_value: "false"

  # Persists the relay's latest commanded state so "Last State" can be
  # applied on restart even with a safety-first hardware default at boot.
  - id: bms_relay_last_state
    type: bool
    restore_value: yes
    initial_value: "false"

# 4. SENSORS (Telemetry)
sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms

    # Total battery capacity setting
    full_charge_capacity:
      name: "BMS Total Capacity"
      state_topic: "jkbms/total_capacity"
      id: bms_total_capacity
      unit_of_measurement: "Ah"
      filters:
        - throttle: 60s

    # Total voltage: publish if it changed by 0.05V, but not more often than once every 2 seconds
    total_voltage:
      name: "BMS Total Voltage"
      state_topic: "jkbms/voltage"
      id: bms_v
      filters:
        - delta: 0.05
        - throttle: 2s

    # Current: publish if it changed by 0.1A
    current:
      name: "BMS Current"
      state_topic: "jkbms/current"
      id: bms_a
      on_value:
        then:
          - if:
              condition:
                lambda: 'return !id(bms_boot_current_sampled);'
              then:
                - lambda: |-
                    id(bms_charging_was_active_at_boot) = x >= ${charging_current_threshold_a}f;
                    id(bms_boot_current_sampled) = true;
                    ESP_LOGI("charging_duration", "Boot sample captured: current=%.2f A, active_at_boot=%s",
                             x, id(bms_charging_was_active_at_boot) ? "true" : "false");
      filters:
        - delta: 0.1
        - throttle: 2s

    # Charge in Ah: publish only if it changed by 0.01 or once every 2 seconds
    capacity_remaining:
      name: "BMS SoC"
      state_topic: "jkbms/soc"
      id: bms_ah
      on_value:
        then:
          # If the capacity dropped below soc_low_limit
          - if:
              condition:
                lambda: 'return id(relay_control_logic_enabled).state && x < id(soc_low_limit_number).state;'
              then:
                - switch.turn_on: bms_relay                
          # If the capacity rose to soc_high_limit and above
          - if:
              condition:
                lambda: 'return id(relay_control_logic_enabled).state && x >= id(soc_high_limit_number).state;'
              then:
                - switch.turn_off: bms_relay                
      filters:
        - delta: 0.01
        - throttle: 2s
        
    # Remaining capacity in percentage (%)
    state_of_charge:
      name: "BMS SoC Percentage"
      id: bms_soc_pct
      state_topic: "jkbms/soc_percent"
      unit_of_measurement: "%"
      device_class: battery
      accuracy_decimals: 0
      filters:
        - delta: 1
        - throttle: 2s
        
    total_charging_cycle_capacity:
      name: "BMS Cycle Capacity"      
      state_topic: "jkbms/cycle_capacity"
      filters:
        - delta: 1
        - throttle: 60s

    # Power (W)
    power:
      name: "BMS Power"
      state_topic: "jkbms/power"
      id: bms_power
      filters:
        - delta: 5.0
        - throttle: 2s    

    # Temperatures: publish if they changed by 0.5 degrees or once per minute
    temperature_sensor_1:
      name: "BMS Temp 1"
      state_topic: "jkbms/t1"
      filters: &temp_filter
        - delta: 0.5
        - throttle: 15s
    temperature_sensor_2:
      name: "BMS Temp 2"
      state_topic: "jkbms/t2"
      filters: *temp_filter  
    temperature_sensor_5:
      name: "BMS MOSFET Temperature"      
      state_topic: "jkbms/mos_temp"
      filters: *temp_filter

    # Cells: the most important part. Publish if it changed by 0.01V
    min_cell_voltage:
      name: "BMS Min Cell"
      state_topic: "jkbms/min_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s
        
    max_cell_voltage:
      name: "BMS Max Cell"
      state_topic: "jkbms/max_c_v"
      filters:
        - delta: 0.01
        - throttle: 5s

    # Imbalance (Delta)
    delta_cell_voltage:
      name: "BMS Cell Delta"
      state_topic: "jkbms/delta"
      filters:
        - delta: 0.002
        - throttle: 5s
        
    # BMS Charging Cycles
    charging_cycles:
      name: "BMS Charging Cycles"
      id: bms_cycles
      state_topic: "jkbms/cycles"
      filters:
        # Cycle count is a slowly-changing integer; delta suppressed all updates.
        # Re-emit the current value every 60s so HA always shows a fresh state.
        - heartbeat: 60s
        
    # Crash diagnostics: the device has no serial access in production, so the
    # last values in Home Assistant history before a "exception/panic" reset are
    # the only evidence. Heap/stack trends separate OOM from stack overflow.
  - platform: debug
    free:
      name: "BMS Heap Free"
    block:
      name: "BMS Heap Largest Block"
    min_free:
      name: "BMS Heap Min Free"      # lowest free heap since boot
    fragmentation:
      name: "BMS Heap Fragmentation"
    loop_time:
      name: "BMS Loop Max Time"      # longest main-loop iteration per interval

  - platform: uptime
    name: "BMS Uptime"
    entity_category: diagnostic

  # Unused stack of the main loop task. Low values (< ~500 B) point to a
  # stack overflow; the lambda runs on that task, so it measures the right one.
  - platform: template
    name: "BMS Loop Stack Free"
    id: loop_stack_free
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return (float) uxTaskGetStackHighWaterMark(nullptr);

    # Wi-Fi signal level
  - platform: wifi_signal
    name: "BMS WiFi Signal RSSI"
    id: wifi_rssi
    update_interval: 15s
    state_topic: "jkbms/wifi_rssi"
    force_update: true

  # Wi-Fi channel number. wifi_info has no channel text sensor, so read it
  # straight off the WiFiComponent.
  - platform: template
    name: "BMS WiFi Channel"
    id: wifi_channel
    icon: "mdi:wifi"
    accuracy_decimals: 0
    update_interval: 15s
    entity_category: diagnostic
    state_topic: "jkbms/wifi_channel"
    lambda: return wifi::global_wifi_component->get_wifi_channel();

  # Bluetooth (BLE) signal level from the BMS
  - platform: ble_rssi
    mac_address: ${bms_mac_address}
    name: "BMS BLE RSSI"
    id: ble_rssi_val    
    state_topic: "jkbms/ble_rssi"
    force_update: true
    filters:
      - filter_out: nan
      - throttle: 15s # Skip values more often than once every 15 seconds
      
  - platform: template
    name: "BMS Charging Time Remaining"
    id: charging_time
    unit_of_measurement: "h"
    state_topic: "jkbms/charging_time_hours"
    accuracy_decimals: 1
    update_interval: 10s # No need to calculate too often
    lambda: |-
      return jkbms_lambdas::calculate_charging_time();
      
  # Split: Positive values for Charging
  - platform: template
    name: "BMS Power Charging"
    id: power_in
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jkbms_lambdas::get_power_in();

  # Split: Absolute values for Discharging
  - platform: template
    name: "BMS Power Discharging"
    id: power_out
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      return jkbms_lambdas::get_power_out();
   # Total Energy Charged (kWh)
  - platform: integration
    name: "BMS Battery Energy In"
    sensor: power_in
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jkbms/energy_in"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001

  # Total Energy Discharged (kWh)
  - platform: integration
    name: "BMS Battery Energy Out"
    sensor: power_out
    time_unit: h
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing    
    accuracy_decimals: 3
    state_topic: "jkbms/energy_out"
    filters:
      # Divide by 1000 to convert Wh to kWh
      - multiply: 0.001
      
# 5. STATUSES (Binary Sensors)
binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms
    charging:
      name: "BMS Charging State"
      state_topic: "jkbms/status/charging"
    discharging:
      name: "BMS Discharging State"
      state_topic: "jkbms/status/discharging"
    balancing:
      name: "BMS Balancing State"
      state_topic: "jkbms/status/balancing"

    # GPIO button 0 (Builtin button "Boot" to wake dislay)
  - platform: gpio
    pin:
      number: 0
      inverted: true
      mode: INPUT_PULLUP
    id: wake_button
    on_press:
      - script.execute: display_timer

  # The BMS's own "charging" flag reflects the charge MOSFET/switch enable
  # bit, which can stay true with near-zero current (charger disconnected,
  # battery topped off, CV tail end). Duration tracking needs actual current
  # flow, so gate it on current instead. Logic lives in jkbms_v2.h.
  - platform: template
    name: "BMS Charging Active"
    id: bms_charging_active
    device_class: battery_charging
    lambda: |-
      return jkbms_lambdas::is_charging_active(${charging_current_threshold_a}f, ${charging_off_delay_ms});
    on_press:
      - lambda: |-
          jkbms_lambdas::on_charging_started();
    on_release:
      - lambda: |-
          jkbms_lambdas::on_charging_stopped();
      - component.update: bms_charging_duration_formatted

  # Raw signal from the isolated AC/grid presence detector module (opto-
  # coupler output) on GPIO12. Kept internal: its polarity depends on
  # wiring/module batch, so "BMS Grid Low" (switch, below) selects which
  # raw level means grid-on, and "GridStatus" (template, below) applies it.
  #
  # Note: GPIO12 (MTDI) is an ESP32 boot strapping pin that selects flash
  # voltage. Driving it HIGH at boot/reset can prevent some boards from
  # booting. Wire/orient the module so it reads LOW while mains power is
  # present (the normal boot condition), reserving HIGH for "grid down".
  - platform: gpio
    pin: ${grid_sensor_pin}
    id: grid_sensor_raw
    internal: true
    filters:
      - delayed_on_off: 500ms

  # Grid/mains presence, derived from the raw GPIO12 signal above and the
  # "BMS Grid Low" switch (handles either wiring polarity without a reflash).
  - platform: template
    name: "BMS Grid Status"
    id: grid_status
    device_class: power
    lambda: |-
      if (!id(grid_sensor_raw).has_state()) {
        return {};
      }
      const bool raw_high = id(grid_sensor_raw).state;
      const bool active_low = id(grid_low).state;
      return active_low ? !raw_high : raw_high;

# Accumulates the persisted charging-duration counter while charging is active.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(bms_charging_active).state) {
            id(bms_charging_duration_s) += 10;
          }

  # Refresh the OLED once a second, but only while it is lit (see display block).
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(my_display).is_on();'
          then:
            - component.update: my_display

button:
    # Factory reset: wipes all stored preferences and reboots.
  - platform: factory_reset
    name: "BMS Factory Reset"
    id: factory_reset_btn
    icon: "mdi:cog-counterclockwise"

    # Forget only the saved WiFi credentials and reboot; on restart the device
    # falls back to its own AP + captive portal (${ap_ssid}) for a new network.
    # Other preferences are kept, so this is NOT a factory reset.
  - platform: template
    name: "BMS WiFi Forget"
    id: wifi_forget_btn
    entity_category: config
    icon: "mdi:wifi-remove"
    on_press:
      - logger.log: "Forgetting WiFi credentials; rebooting into setup AP"
      - lambda: |-
          // save_wifi_sta persists the empty credentials to NVS immediately.
          wifi::global_wifi_component->save_wifi_sta("", "");
      - delay: 1s
      - lambda: "App.safe_reboot();"

  - platform: restart
    name: "BMS Restart Device"
    id: restart_btn
    icon: "mdi:restart"

    # One-off checks of the panic capture. Disabled in HA until you enable the
    # entity; pressing one crashes and reboots the device on purpose. After the
    # reboot "BMS Last Panic" and "BMS Last Panic Backtrace" must be filled in.
  - platform: template
    name: "BMS Test Panic (abort)"
    id: test_panic_abort_btn
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:bug-outline"
    on_press:
      - lambda: "abort();"

  - platform: template
    name: "BMS Test Panic (fault)"
    id: test_panic_fault_btn
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:bug-outline"
    on_press:
      - lambda: "*(volatile int *) 0 = 1;"

# 6. CONTROL (Switches)
# Allow turning charge/discharge on/off via MQTT
switch:
# Power relay on pin ${relay_control_pin}
  - platform: gpio
    pin: ${relay_control_pin}
    name: "BMS Control Relay"
    id: bms_relay
    restore_mode: ALWAYS_OFF # On boot the relay is always off
      # MQTT settings:
    state_topic: "jkbms/relay/state"      # The phone will see the status here
    command_topic: "jkbms/relay/set"    # The phone will send ON/OFF here    
    # Tie the blue LED to the relay state
    on_turn_on:
      - lambda: |-
          id(bms_relay_last_state) = true;
      - output.turn_on: blue_led_out
    on_turn_off:
      - lambda: |-
          id(bms_relay_last_state) = false;
      - output.turn_off: blue_led_out

  - platform: template
    name: "BMS Control Relay Logic"
    id: relay_control_logic_enabled
    entity_category: config
    icon: "mdi:transistor"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "Control relay logic enabled"
      - script.execute: apply_relay_soc_rules
    turn_off_action:
      - logger.log: "Control relay logic disabled; relay state will remain unchanged"

  # Selects which raw level of the GPIO12 grid sensor means "grid on":
  # ON = LOW means grid on (active-low module), OFF = HIGH means grid on.
  # Flip this from Home Assistant to match your module's wiring without
  # needing to reflash. See "GridStatus" and the raw GPIO12 sensor above.
  - platform: template
    name: "BMS Grid Low"
    id: grid_low
    entity_category: config
    icon: "mdi:transmission-tower"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "Grid sensor polarity set to active-LOW (LOW = grid on)"
    turn_off_action:
      - logger.log: "Grid sensor polarity set to active-HIGH (HIGH = grid on)"

  # JKBMS Switches
  - platform: jk_bms_ble
    jk_bms_ble_id: my_bms
    charging:
      name: "BMS Charging Switch"
      state_topic: "jkbms/switch/charge/state"
      command_topic: "jkbms/switch/charge/set"
    discharging:
      name: "BMS Discharging Switch"
      state_topic: "jkbms/switch/discharge/state"
      command_topic: "jkbms/switch/discharge/set"
    balancer:
      name: "BMS Balancer Switch"
      state_topic: "jkbms/switch/balance/state"
      command_topic: "jkbms/switch/balance/set"

# 6.5 CONFIGURABLE NUMBERS (SOC Limits)
# These are storable, configurable via MQTT and Home Assistant
# MQTT discovery is automatic via ESPHome API
select:
  - platform: template
    name: "BMS Relay Restart Behavior"
    id: relay_restart_behavior
    entity_category: config
    icon: "mdi:restart-alert"
    optimistic: true
    restore_value: true
    initial_option: "Last State"
    options:
      - "Always OFF"
      - "Always ON"
      - "Last State"
    set_action:
      then:
        - lambda: |-
            id(relay_restart_behavior).publish_state(x);
            ESP_LOGI("relay_boot", "Restart behavior set to: %s", x.c_str());

number:
  - platform: template
    name: "BMS SoC Low Limit (Ah)"
    id: soc_low_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    device_class: energy
    mode: box
    optimistic: true
    restore_value: yes
    # Default value: total_capacity * soc_low_limit_percentage = total_capacity * 0.6 (60%)
    initial_value: ${soc_low_limit_initial}
    set_action:
      then:
        - lambda: |-
            const float rounded_x = roundf(x);
            id(soc_low_limit_number).publish_state(rounded_x);
            jkbms_lambdas::log_soc_limit_change("SOC Low Limit", rounded_x);
        - script.execute: apply_relay_soc_rules
    
  - platform: template
    name: "BMS SoC High Limit (Ah)"
    id: soc_high_limit_number
    min_value: 0
    max_value: 500
    step: 1
    unit_of_measurement: "Ah"
    device_class: energy
    mode: box
    optimistic: true
    restore_value: yes
    # Default value: total_capacity * soc_high_limit_percentage = total_capacity * 0.99 (99%)
    initial_value: ${soc_high_limit_initial}
    set_action:
      then:
        - lambda: |-
            const float rounded_x = roundf(x);
            id(soc_high_limit_number).publish_state(rounded_x);
            jkbms_lambdas::log_soc_limit_change("SOC High Limit", rounded_x);
        - script.execute: apply_relay_soc_rules

