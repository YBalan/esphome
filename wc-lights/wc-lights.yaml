substitutions:
  # Device
  device_name: wc-lights
  friendly_name: WC Lights

  # WiFi AP fallback
  ap_ssid: AP-WC-Lights
  ap_password: password

  # Timezone
  timezone: Europe/Kyiv

  # Hardware pins
  wc_light_pin: GPIO18
  bath_light_pin: GPIO19
  wc_door_pin: GPIO21
  bath_door_pin: GPIO22  
  rgb_strip_pin: GPIO27
  reset_counters_pin: GPIO4

  # Door input settings (NO/NC per room)
  wc_endstop_mode_default: "NC"
  bath_endstop_mode_default: "NC"
  door_debounce_on: 150ms
  door_debounce_off: 150ms

  # MOSFET PWM dimming
  # Increase if you notice visible flicker, decrease if MOSFET gets warm.
  led_pwm_frequency: 2000Hz

  # RGB strip
  rgb_led_count: "50"
  rgb_usable_led_count: "49"
  rgb_default_active_led_count: "26"
  strip_wc_inside_brightness_pct: "35"
  strip_flash_brightness_pct: "35"
  strip_flash_fade_duration_ms: "1200"
  rgb_order: GRB

  # Night mode schedule
  night_start_hour: "23"
  night_start_minute: "0"
  night_end_hour: "7"
  night_end_minute: "0"

  # Blink reminder settings
  wc_inside_blink_interval_minutes: "5"
  wc_inside_blink_count: "3"

  # Main lights brightness (%)
  wc_day_brightness_pct: "90"
  wc_night_brightness_pct: "30"
  bath_day_brightness_pct: "100"
  bath_night_brightness_pct: "100"

  # Door-open timeout before next close is treated as no-entry (seconds)
  wc_open_timeout_seconds: "10"
  bath_open_timeout_seconds: "20"

  # Post-visit flashlight duration (seconds)
  wc_flashlight_duration_seconds: "30"
  bath_flashlight_duration_seconds: "30"

  # Diagnostics
  wifi_rssi_update: 30s
  visit_sensor_update: 1s
  main_light_transition: 150ms

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - wc-lights.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          wc_lights::set_test_mode(id(status_strip_test_active), true);
      - light.turn_on:
          id: status_strip
          effect: Rainbow
          brightness: 20%
      - delay: 5s
      - lambda: |-
          wc_lights::set_test_mode(id(status_strip_test_active), false);

          const uint32_t now_ms = millis();

          wc_lights::restore_room_state_after_boot(
            id(wc_user_inside_flag),
            id(wc_door_open_started_ms),
            id(wc_entry_started_ms),
            id(wc_door_sensor),
            id(wc_user_inside),
            id(wc_time_inside_sensor),
            now_ms
          );

          wc_lights::restore_room_state_after_boot(
            id(bath_user_inside_flag),
            id(bath_door_open_started_ms),
            id(bath_entry_started_ms),
            id(bath_door_sensor),
            id(bath_user_inside),
            id(bath_time_inside_sensor),
            now_ms
          );
      - script.execute: update_status_strip

esp32:
  board: esp32dev
  framework:  
    type: esp-idf

logger:
  level: INFO
  #baud_rate: 0

ota:
  - platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

wifi:  
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
  fast_connect: true
  reboot_timeout: 0s

captive_portal:

#web_server:
  #port: 80

api:

globals:
  - id: wc_user_inside_flag
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: bath_user_inside_flag
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: wc_door_open_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: bath_door_open_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: wc_entry_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: bath_entry_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: wc_last_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: bath_last_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  - id: wc_total_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: bath_total_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  - id: wc_max_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: bath_max_visit_seconds
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  - id: wc_visit_count
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: bath_visit_count
    type: uint32_t
    restore_value: yes
    initial_value: "0"

  - id: wc_flash_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: bath_flash_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: wc_flash_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: bath_flash_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: status_strip_test_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: wc_inside_blink_next_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: wc_inside_blink_running
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wc_inside_blink_prev_was_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: wc_inside_blink_prev_brightness
    type: float
    restore_value: no
    initial_value: "1.0"

script:
  - id: update_status_strip
    mode: restart
    then:
      - lambda: |-
          wc_lights::update_status_strip_from_presets(id(status_strip), id(status_strip_test_active), id(wc_user_inside_flag), id(wc_flash_active), id(bath_flash_active), id(wc_flash_started_ms), id(bath_flash_started_ms), millis(), wc_lights::to_int(id(num_strip_wc_inside_brightness).state), wc_lights::to_int(id(num_strip_flash_brightness).state), wc_lights::to_int(id(num_wc_flashlight_duration).state), wc_lights::to_int(id(num_bath_flashlight_duration).state), ${strip_flash_fade_duration_ms}, id(wc_inside_color_preset).current_option(), id(wc_flash_color_preset).current_option(), id(bath_flash_color_preset).current_option(), wc_lights::to_int(id(num_status_strip_length).state));

  - id: test_status_strip_rainbow
    mode: restart
    then:
      - lambda: |-
          wc_lights::set_test_mode(id(status_strip_test_active), true);
      - light.turn_on:
          id: status_strip
          effect: Rainbow
          brightness: 35%
      - delay: 15s
      - lambda: |-
          wc_lights::set_test_mode(id(status_strip_test_active), false);
      - script.execute: update_status_strip

  - id: wc_flashlight_script
    mode: restart
    then:
      - lambda: |-
          wc_lights::start_flash(id(wc_flash_active), id(wc_flash_started_ms), millis());
      - script.execute: update_status_strip
      - while:
          condition:
            lambda: return !wc_lights::flash_completed(id(wc_flash_started_ms), millis(), wc_lights::to_int(id(num_wc_flashlight_duration).state), ${strip_flash_fade_duration_ms});
          then:
            - delay: 100ms
            - script.execute: update_status_strip
      - lambda: |-
          wc_lights::stop_flash(id(wc_flash_active));
      - script.execute: update_status_strip

  - id: wc_inside_periodic_blink_script
    mode: single
    then:
      - lambda: |-
          wc_lights::start_wc_inside_blink(id(wc_inside_blink_running), id(wc_inside_blink_prev_was_on), id(wc_inside_blink_prev_brightness), id(wc_main_light), wc_lights::to_int(id(num_wc_day_brightness).state));
      - repeat:
          count: !lambda |-
            return wc_lights::to_int(id(num_wc_inside_blink_count).state);
          then:
            - light.turn_off:
                id: wc_main_light
                transition_length: 500ms
            - delay: 700ms
            - light.turn_on:
                id: wc_main_light
                brightness: !lambda |-
                  return wc_lights::to_brightness(id(wc_inside_blink_prev_brightness));
                transition_length: 500ms
            - delay: 700ms
      - if:
          condition:
            lambda: |-
              return wc_lights::to_bool(id(wc_inside_blink_prev_was_on));
          then:
            - light.turn_on:
                id: wc_main_light
                brightness: !lambda |-
                  return wc_lights::to_brightness(id(wc_inside_blink_prev_brightness));
                transition_length: ${main_light_transition}
          else:
            - light.turn_off:
                id: wc_main_light
                transition_length: ${main_light_transition}
      - lambda: |-
          wc_lights::finish_wc_inside_blink(id(wc_inside_blink_running));

  - id: bath_flashlight_script
    mode: restart
    then:
      - lambda: |-
          wc_lights::start_flash(id(bath_flash_active), id(bath_flash_started_ms), millis());
      - script.execute: update_status_strip
      - while:
          condition:
            lambda: return !wc_lights::flash_completed(id(bath_flash_started_ms), millis(), wc_lights::to_int(id(num_bath_flashlight_duration).state), ${strip_flash_fade_duration_ms});
          then:
            - delay: 100ms
            - script.execute: update_status_strip
      - lambda: |-
          wc_lights::stop_flash(id(bath_flash_active));
      - script.execute: update_status_strip

  - id: handle_wc_door_open
    mode: restart
    then:
      - lambda: |-
          wc_lights::handle_room_door_open(
            id(wc_door_open_started_ms),
            millis(),
            id(wc_main_light),
            id(sntp_time).now(),
            (int)id(num_wc_day_brightness).state,
            (int)id(num_wc_night_brightness).state,
            (int)id(num_night_start_hour).state,
            (int)id(num_night_start_minute).state,
            (int)id(num_night_end_hour).state,
            (int)id(num_night_end_minute).state
          );

  - id: handle_wc_door_close
    mode: restart
    then:
      - lambda: |-
          wc_lights::handle_room_door_close(
            millis(),
            id(wc_user_inside_flag),
            id(wc_door_open_started_ms),
            id(wc_entry_started_ms),
            id(wc_last_visit_seconds),
            id(wc_total_visit_seconds),
            id(wc_max_visit_seconds),
            id(wc_visit_count),
            id(wc_main_light),
            id(wc_flashlight_script),
            id(update_status_strip),
            id(wc_user_inside),
            id(wc_time_inside_sensor),
            id(wc_max_time_inside_sensor),
            id(wc_last_visit_sensor),
            id(wc_visit_count_sensor),
            id(sntp_time).now(),
            (int)id(num_wc_open_timeout).state,
            (int)id(num_wc_day_brightness).state,
            (int)id(num_wc_night_brightness).state,
            (int)id(num_night_start_hour).state,
            (int)id(num_night_start_minute).state,
            (int)id(num_night_end_hour).state,
            (int)id(num_night_end_minute).state
          );

  - id: handle_bath_door_open
    mode: restart
    then:
      - lambda: |-
          wc_lights::handle_room_door_open(
            id(bath_door_open_started_ms),
            millis(),
            id(bath_main_light),
            id(sntp_time).now(),
            (int)id(num_bath_day_brightness).state,
            (int)id(num_bath_night_brightness).state,
            (int)id(num_night_start_hour).state,
            (int)id(num_night_start_minute).state,
            (int)id(num_night_end_hour).state,
            (int)id(num_night_end_minute).state
          );

  - id: handle_bath_door_close
    mode: restart
    then:
      - lambda: |-
          wc_lights::handle_room_door_close(
            millis(),
            id(bath_user_inside_flag),
            id(bath_door_open_started_ms),
            id(bath_entry_started_ms),
            id(bath_last_visit_seconds),
            id(bath_total_visit_seconds),
            id(bath_max_visit_seconds),
            id(bath_visit_count),
            id(bath_main_light),
            id(bath_flashlight_script),
            id(update_status_strip),
            id(bath_user_inside),
            id(bath_time_inside_sensor),
            id(bath_max_time_inside_sensor),
            id(bath_last_visit_sensor),
            id(bath_visit_count_sensor),
            id(sntp_time).now(),
            (int)id(num_bath_open_timeout).state,
            (int)id(num_bath_day_brightness).state,
            (int)id(num_bath_night_brightness).state,
            (int)id(num_night_start_hour).state,
            (int)id(num_night_start_minute).state,
            (int)id(num_night_end_hour).state,
            (int)id(num_night_end_minute).state
          );

  - id: reset_all_counters_script
    mode: restart
    then:
      - lambda: |-
          wc_lights::reset_all_visit_counters(
            id(wc_last_visit_seconds),
            id(bath_last_visit_seconds),
            id(wc_total_visit_seconds),
            id(bath_total_visit_seconds),
            id(wc_max_visit_seconds),
            id(bath_max_visit_seconds),
            id(wc_visit_count),
            id(bath_visit_count),
            id(wc_last_visit_sensor),
            id(bath_last_visit_sensor),
            id(wc_max_time_inside_sensor),
            id(bath_max_time_inside_sensor),
            id(wc_visit_count_sensor),
            id(bath_visit_count_sensor)
          );

interval:
  - interval: 1s
    then:
      - lambda: |-
          wc_lights::handle_wc_inside_blink_schedule(id(wc_user_inside_flag), id(wc_inside_blink_running), id(wc_inside_blink_next_ms), id(wc_entry_started_ms), wc_lights::to_int(id(num_wc_inside_blink_interval_minutes).state), millis(), id(wc_inside_periodic_blink_script));

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
              return id(wc_flash_active) || id(bath_flash_active);
          then:
            - script.execute: update_status_strip

output:
  - platform: ledc
    id: wc_light_output
    pin: ${wc_light_pin}
    frequency: ${led_pwm_frequency}

  - platform: ledc
    id: bath_light_output
    pin: ${bath_light_pin}
    frequency: ${led_pwm_frequency}

light:
  - platform: monochromatic
    id: wc_main_light
    name: WC - Light
    output: wc_light_output
    default_transition_length: ${main_light_transition}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    id: bath_main_light
    name: Bath - Light
    output: bath_light_output
    default_transition_length: ${main_light_transition}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: esp32_rmt_led_strip
    id: status_strip_raw
    pin: ${rgb_strip_pin}
    num_leds: ${rgb_led_count}
    rgb_order: ${rgb_order}
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: partition
    id: status_strip
    name: Device - Status Strip
    segments:
      # Reserve pixel 0 as NULL pixel and expose LEDs 1..N-1.
      - id: status_strip_raw
        from: 1
        to: ${rgb_usable_led_count}
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 8
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 1
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 100ms
          reverse: false
      - addressable_scan:
          name: Scan
          move_interval: 100ms
          scan_width: 1
      - addressable_twinkle:
          name: Twinkle
          twinkle_probability: 5%
          progress_interval: 16ms
      - addressable_random_twinkle:
          name: Random Twinkle
          twinkle_probability: 5%
          progress_interval: 64ms
      - addressable_fireworks:
          name: Fireworks
          update_interval: 64ms
          spark_probability: 5%
          use_random_color: true
          fade_out_rate: 120
      - addressable_flicker:
          name: Flicker
          update_interval: 33ms
          intensity: 2%
      - strobe:
          name: Strobe
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 100%
              duration: 250ms
            - state: false
              duration: 250ms
      - pulse:
          name: Pulse
          transition_length: 2s
          update_interval: 2s
          min_brightness: 10%
          max_brightness: 60%
      - flicker:
          name: Soft Flicker
          alpha: 97%
          intensity: 0.8%

binary_sensor:
  - platform: gpio
    id: wc_door_raw
    internal: true
    pin:
      number: ${wc_door_pin}
      mode:
        input: true
        pullup: true
      inverted: false
    filters:
      - delayed_on: ${door_debounce_on}
      - delayed_off: ${door_debounce_off}

  - platform: gpio
    id: bath_door_raw
    internal: true
    pin:
      number: ${bath_door_pin}
      mode:
        input: true
        pullup: true
      inverted: false
    filters:
      - delayed_on: ${door_debounce_on}
      - delayed_off: ${door_debounce_off}

  - platform: template
    id: wc_door_sensor
    name: WC - Door
    device_class: door
    lambda: |-
      return wc_lights::resolve_endstop_from_raw(id(wc_door_raw).state, id(wc_endstop_mode).current_option());
    on_press:
      then:
        - script.execute: handle_wc_door_open
    on_release:
      then:
        - script.execute: handle_wc_door_close

  - platform: template
    id: bath_door_sensor
    name: Bath - Door
    device_class: door
    lambda: |-
      return wc_lights::resolve_endstop_from_raw(id(bath_door_raw).state, id(bath_endstop_mode).current_option());
    on_press:
      then:
        - script.execute: handle_bath_door_open
    on_release:
      then:
        - script.execute: handle_bath_door_close

  - platform: template
    id: wc_user_inside
    name: WC - User Inside
    device_class: occupancy
    lambda: |-
      return wc_lights::to_binary_state(id(wc_user_inside_flag));

  - platform: template
    id: bath_user_inside
    name: Bath - User Inside
    device_class: occupancy
    lambda: |-
      return wc_lights::to_binary_state(id(bath_user_inside_flag));

  - platform: gpio
    id: reset_counters_gpio
    name: Reset Visit Counters GPIO
    internal: true
    pin:
      number: ${reset_counters_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute: reset_all_counters_script

sensor:
  - platform: wifi_signal
    name: Device - WiFi RSSI
    id: wifi_rssi
    update_interval: ${wifi_rssi_update}
    entity_category: diagnostic

  - platform: template
    id: wc_time_inside_sensor
    name: WC - Time User Spent Inside
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:timer-outline
    update_interval: ${visit_sensor_update}
    lambda: |-
      return wc_lights::room_time_inside_seconds(id(wc_user_inside_flag), id(wc_entry_started_ms), millis());

  - platform: template
    id: bath_time_inside_sensor
    name: Bath - Time User Spent Inside
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:timer-outline
    update_interval: ${visit_sensor_update}
    lambda: |-
      return wc_lights::room_time_inside_seconds(id(bath_user_inside_flag), id(bath_entry_started_ms), millis());

  - platform: template
    id: wc_max_time_inside_sensor
    name: WC - Max Time User Inside
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:timer-star-outline
    update_interval: 10s
    lambda: |-
      return wc_lights::to_float_seconds(id(wc_max_visit_seconds));

  - platform: template
    id: bath_max_time_inside_sensor
    name: Bath - Max Time User Inside
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:timer-star-outline
    update_interval: 10s
    lambda: |-
      return wc_lights::to_float_seconds(id(bath_max_visit_seconds));

  - platform: template
    id: wc_last_visit_sensor
    name: WC - Last Visit Duration
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:history
    update_interval: never
    lambda: |-
      return wc_lights::to_float_seconds(id(wc_last_visit_seconds));

  - platform: template
    id: bath_last_visit_sensor
    name: Bath - Last Visit Duration
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: mdi:history
    update_interval: never
    lambda: |-
      return wc_lights::to_float_seconds(id(bath_last_visit_seconds));

  - platform: template
    id: wc_visit_count_sensor
    name: WC - Visit Count
    unit_of_measurement: visits
    accuracy_decimals: 0
    icon: mdi:counter
    update_interval: never
    lambda: |-
      return static_cast<float>(id(wc_visit_count));

  - platform: template
    id: bath_visit_count_sensor
    name: Bath - Visit Count
    unit_of_measurement: visits
    accuracy_decimals: 0
    icon: mdi:counter
    update_interval: never
    lambda: |-
      return static_cast<float>(id(bath_visit_count));

text_sensor:
  - platform: template
    id: wc_total_inside_text_sensor
    name: WC - Total Time Inside
    icon: mdi:calendar-clock
    update_interval: ${visit_sensor_update}
    lambda: |-
      return wc_lights::format_total_duration_with_live_room_time(id(wc_total_visit_seconds), id(wc_user_inside_flag), id(wc_entry_started_ms), millis());

  - platform: template
    id: bath_total_inside_text_sensor
    name: Bath - Total Time Inside
    icon: mdi:calendar-clock
    update_interval: ${visit_sensor_update}
    lambda: |-
      return wc_lights::format_total_duration_with_live_room_time(id(bath_total_visit_seconds), id(bath_user_inside_flag), id(bath_entry_started_ms), millis());

  - platform: template
    id: wc_last_visit_text_sensor
    name: WC - Last Visit Duration Human
    icon: mdi:history
    update_interval: ${visit_sensor_update}
    lambda: |-
      return wc_lights::format_visit_duration_from_seconds(id(wc_last_visit_seconds));

  - platform: template
    id: bath_last_visit_text_sensor
    name: Bath - Last Visit Duration Human
    icon: mdi:history
    update_interval: ${visit_sensor_update}
