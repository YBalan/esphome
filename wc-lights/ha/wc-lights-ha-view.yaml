views:
  - type: sections
    max_columns: 2
    path: main
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            cards:
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.jkbms_gateway_v2_bms_soc_percentage_2
                    name: ''
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        } 
                  - type: tile
                    entity: binary_sensor.314_charging_composite
                    name: ''
                    state_content:
                      - last_duration
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }                            
                  - type: tile
                    entity: sensor.lobby_jkbms_gateway_v2_bms_charging_time_formatted
                    icon: mdi:timer
                    name: ''
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }                 
              - type: gauge
                entity: sensor.jkbms_gateway_v2_bms_soc_2
                name: ''
                min: 0
                max: 314
                needle: true
                severity:
                  green: 250
                  yellow: 200
                  red: 0
                card_mod:
                  style: |
                    ha-card {
                      border: none;
                      background: transparent;
                      margin-top: -40px; 
                      margin-bottom: -30px;
                    }
                    ha-card::before {
                      content: "{{ '%0.1f' | format(states('sensor.jkbms_gateway_v2_bms_mosfet_temperature_2') | float(0)) }}°C";
                      position: absolute;
                      bottom: 35px;
                      left: 20px;
                      font-size: 12px;
                      color: var(--secondary-text-color);
                    }       
                    ha-card::after {
                      white-space: pre;
                      content: "{{ '%0.0f' | format(states('sensor.jkbms_gateway_v2_bms_total_capacity_2') | float(0)) }}Ah \A {{ "%0.0f" | format(states('sensor.jkbms_gateway_v2_bms_cycle_capacity_2') | float(0)) }}Ah \A {{ "%0d" | format(states('sensor.jkbms_gateway_v2_bms_charging_cycles_2') | int(0)) }}";
                      position: absolute;
                      bottom: 50px;
                      right: 20px;
                      font-size: 12px;
                      color: var(--secondary-text-color);
                      text-align: right;
                    }
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.jkbms_gateway_v2_bms_current_2
                    name: Current
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }                 
                  - type: tile
                    entity: sensor.jkbms_gateway_v2_bms_total_voltage_2
                    name: Batt V
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }  
                  - type: tile
                    entity: switch.jkbms_gateway_v2_bms_control_relay_2
                    name: ''
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }           
      - type: grid
        cards:
          - type: custom:stack-in-card
            cards:
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.jbdbms_gateway_v2_jbd_soc_percentage_2
                    name: ''
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }            
                  - type: tile
                    entity: binary_sensor.200_charging_composite
                    name: ''
                    state_content:
                      - last_duration
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;              
                        }       
                  - type: tile
                    entity: sensor.jbdbms_gateway_v2_jbd_charging_time_formatted_2
                    icon: mdi:timer
                    name: ''
                    card_mod:
                      style: |
                        ha-card {              
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }       
              - type: gauge
                entity: sensor.jbdbms_gateway_v2_jbd_soc_ah_2
                name: ''
                min: 0
                max: 200
                needle: true
                severity:
                  green: 160
                  yellow: 100
                  red: 0
                card_mod:
                  style: |
                    ha-card {
                      border: none;
                      background: transparent;
                      margin-top: -40px; 
                      margin-bottom: -30px;
                    }
                    ha-card::before {
                      content: "{{ '%0.1f' | format(states('sensor.jbdbms_gateway_v2_jbd_temp_1_2') | float(0)) }}°C";
                      position: absolute;
                      bottom: 35px;
                      left: 20px;
                      font-size: 12px;
                      color: var(--secondary-text-color);
                    }
                    ha-card::after {
                      white-space: pre;
                      content: "{{ '%0.0f' | format(states('sensor.jbdbms_gateway_v2_jbd_total_capacity_2') | float(0)) }}Ah \A {{ "%0d" | format(states('sensor.jbdbms_gateway_v2_jbd_charging_cycles_2') | int(0)) }}";
                      position: absolute;
                      bottom: 35px;
                      right: 20px;
                      font-size: 12px;
                      color: var(--secondary-text-color);
                    }
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.jbdbms_gateway_v2_jbd_current_2
                    name: Current
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }           
                  - type: tile
                    entity: sensor.jbdbms_gateway_v2_jbd_total_voltage_2
                    name: Batt V
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }           
                  - type: tile
                    entity: switch.jbdbms_gateway_v2_jbd_control_relay_2
                    name: ''
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;              
                        } 
      - type: grid
        cards:
          - type: custom:stack-in-card
            cards:
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.boiler_temp_with_trend
                    name: Trend
                    state_content:
                      - state
                      - last_changed
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                        ha-tile-icon {
                          --tile-color: {{ state_attr('sensor.boiler_temp_with_trend', 'trend_color') }} !important;
                        }
                        .icon-container {
                          background-color: {{ state_attr('sensor.boiler_temp_with_trend', 'trend_color') }}15 !important;
                        }
                  - type: tile
                    entity: binary_sensor.electrolux_boiler_boiler_heating_2
                    name: Status
                    state_content:
                      - state
                      - last_changed
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                        ha-tile-icon {
                          --tile-color: {% if is_state('binary_sensor.electrolux_boiler_boiler_heating_2', 'on') %} red {% else %} grey {% endif %} !important;
                        }
                        .icon-container {
                          background-color: {% if is_state('binary_sensor.electrolux_boiler_boiler_heating_2', 'on') %} red {% else %} grey {% endif %}15 !important;
                        }
              - type: gauge
                entity: sensor.electrolux_boiler_boiler_current_temp
                name: ''
                min: 35
                max: 75
                needle: true
                severity:
                  green: 45
                  yellow: 60
                  red: 70
                card_mod:
                  style: |
                    ha-card {
                      border: none;
                      background: transparent;
                      margin-top: -40px; 
                      margin-bottom: -30px;
                    }
              - type: entities
                entities:
                  - entity: number.electrolux_boiler_boiler_target_temp_set_2
                    name: Target
                    icon: mdi:temperature-celsius
                  - entity: select.electrolux_boiler_boiler_power_mode_set_2
                    name: Mode
                  - entity: switch.electrolux_boiler_boiler_bst_mode_2
                    name: BST
                card_mod:
                  style: |
                    ha-card {
                      border: none;
                      background: transparent;
                      padding-bottom: 0px;
                    }
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: switch.electrolux_boiler_boiler_main_power_2
                    name: Power
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: switch.s1_boiler_socket_1
                    name: Socket
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: light.electrolux_boiler_lcd_display_switch_2
                    name: LCD
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.electrolux_boiler_boiler_clock
                    name: Clock
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: number.electrolux_boiler_boiler_timer_start_hour
                    name: Hours Timer
                    icon: mdi:hours-24
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: number.electrolux_boiler_boiler_timer_start_minute
                    name: Minutes Timer
                    icon: mdi:timer-cog-outline
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.electrolux_boiler_boiler_total_energy
                    name: Energy
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: button.electrolux_boiler_boiler_reset_total_energy_2
                    name: Reset Energy
                    state_content: []
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: sensor.electrolux_boiler_boiler_current_temp
                    name: Current
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
      - type: grid
        cards:
          - type: custom:stack-in-card
            cards:
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: Fridge
                  show_states: true
                  colorize_states: true
                graph_span: 4h
                apex_config:
                  tooltip:
                    shared: true
                    intersect: false
                  xaxis:
                    type: datetime
                    tickAmount: 8
                  grid:
                    show: true
                    strokeDashArray: 3
                    xaxis:
                      lines:
                        show: true
                yaxis:
                  - id: sensor
                    decimals: 2
                  - id: number
                    decimals: 2
                  - id: power
                    decimals: 0
                    opposite: true
                  - id: door_axis
                    show: false
                    min: 0
                    max: 1
                series:
                  - entity: sensor.refrigerator_fridge_temperature
                    yaxis_id: sensor
                    name: Cur
                    stroke_width: 5
                    fill_raw: last
                  - entity: number.refrigerator_fridge_temperature
                    yaxis_id: sensor
                    name: Set
                    stroke_width: 1
                    fill_raw: last
                  - entity: sensor.refrigerator_power_max
                    yaxis_id: power
                    name: Pow
                    type: area
                    stroke_width: 1
                    fill_raw: last
                    show:
                      extremas: true
                  - entity: sensor.refrigerator_run_duration
                    name: Power Time
                    color: '#3498db'
                    show:
                      in_chart: false
                    group_by:
                      func: last
                      duration: 1m
                      fill: last
                  - entity: sensor.refrigerator_rest_duration
                    name: Rest Time
                    color: '#2ecc71'
                    show:
                      in_chart: false
                    group_by:
                      func: last
                      duration: 1m
                      fill: last
                  - entity: binary_sensor.refrigerator_fridge_door
                    yaxis_id: door_axis
                    name: Door
                    type: column
                    color: '#ffeb3b'
                    stroke_width: 3
                    transform: 'return x === ''on'' ? 1 : 0;'
                    show:
                      legend_value: true
                      in_header: false
                      in_legend: true
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: sensor.refrigerator_freezer_temperature
                    name: Freezer Cur
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: number.refrigerator_freezer_temperature
                    name: Freezer Set
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }
                  - type: tile
                    entity: script.reload_fridge_entities
                    name: Reload
                    state_content: []
                    tap_action:
                      action: call-service
                      service: script.reload_fridge_entities
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                        }            
          - type: tile
            grid_options:
              columns: 6
              rows: 1
            entity: sensor.generator_generator_voltage
            name: Gen Voltage
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.generator_generator_current_run_duration
            name: Gen Run
            vertical: false
            features_position: bottom
          - type: tile
            entity: >-
              sensor.garage_generator_charger_generator_charger_battery_voltage_2
            name: Gen Batt Volt
            vertical: false
            features_position: bottom
          - type: tile
            entity: >-
              sensor.garage_generator_charger_generator_charger_battery_percentage_2
            name: Gen Battery
            vertical: false
            features_position: bottom
      - cards:
          - type: history-graph
            entities:
              - entity: binary_sensor.main_grid_power_status_2
                name: Grid
            hours_to_show: 36
            logarithmic_scale: false
            expand_legend: false
    icon: mdi:chart-donut-variant
    cards: []
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.refrigerator_power_max
        icon: mdi:fridge
        name: Fridge
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.main_ups_current
        icon: mdi:current-ac
        name: UPS
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.generatorpow_phase_a_voltage
        name: Grid
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: binary_sensor.main_grid_power_status_2
        name: Grid
        state_content: last_changed_stable
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.s9_fridge_power
        name: S9 Fridge
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.refrigerator_power
        name: Fridge
        show_entity_picture: false
        state_content: state
        icon: mdi:fridge
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.zmai_90_ups_current
        name: ZMAi
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.zmai_90_ups_voltage
        name: ZMAi
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
