type: sections
max_columns: 3
title: wc
sections:
  - type: grid
    cards:
      - type: heading
        heading: 🚽 WC Control
      - type: vertical-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.wc_lights_wc_light
            name: Main Light
            show_brightness_control: true
            use_light_color: true
            card_mod:
              style: |
                ha-card {
                  border-bottom-left-radius: 0px !important;
                  border-bottom-right-radius: 0px !important;
                  margin-bottom: -1px !important;
                  box-shadow: none !important;
                }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.wc_lights_wc_user_inside
                name: Presence
                icon_color: blue
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 0px !important;
                      border-top: none !important;
                      border-bottom: none !important;
                      box-shadow: none !important;
                      margin-right: -1px !important;
                    }
              - type: custom:mushroom-entity-card
                entity: binary_sensor.wc_lights_wc_door
                name: Door
                icon_color: orange
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 0px !important;
                      border-top: none !important;
                      border-bottom: none !important;
                      box-shadow: none !important;
                    }
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.wc_lights_wc_total_time_inside
                name: Total Time Inside
              - entity: sensor.wc_lights_wc_time_user_spent_inside
                name: Time Inside
              - entity: sensor.wc_lights_wc_last_visit_duration_human
                name: Last Visit
              - entity: sensor.wc_lights_wc_max_time_user_inside_human
                name: Max Visit
              - entity: sensor.wc_lights_wc_visit_count
                name: Visit Count
              - type: section
                label: Settings
              - entity: number.wc_lights_wc_day_brightness
                name: Day Brightness
              - entity: number.wc_lights_wc_night_brightness
                name: Night Brightness
              - entity: number.wc_lights_wc_door_open_timeout
                name: Auto-Off Timeout
              - entity: select.wc_lights_wc_endstop_mode
                name: Sensor Mode
              - entity: select.wc_lights_wc_flash_color
                name: Post Visit Flash Color
              - entity: number.wc_lights_wc_post_visit_flash_duration
                name: Post Visit Flash Timeout
              - type: section
                label: Inside Status Strip
              - entity: number.wc_lights_wc_status_strip_inside_brightness
                name: Inside Brightness
              - entity: select.wc_lights_wc_inside_color
                name: Inside Color
              - type: section
                label: Inside Blink Settings
              - entity: number.wc_lights_wc_inside_blink_reminder_interval
                name: Blink Timeout
              - entity: number.wc_lights_wc_inside_blink_reminder_count
                name: Blink Count
              - entity: button.wc_lights_wc_test_inside_blink_reminder
                name: Blink Test
            card_mod:
              style: |
                ha-card {
                  border-top-left-radius: 0px !important;
                  border-top-right-radius: 0px !important;
                  border-top: none !important;
                  box-shadow: none !important;
                  margin-top: -1px !important;
                  --mdc-typography-body1-font-size: 14px;
                  overflow: visible !important;
                }
                .card-content {
                  padding-top: 0px !important;
                  overflow: visible !important;
                }
  - type: grid
    cards:
      - type: heading
        heading: 🛀 Bath Control
      - type: vertical-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.wc_lights_bath_light
            name: Main Light
            show_brightness_control: true
            use_light_color: true
            card_mod:
              style: |
                ha-card {
                  border-bottom-left-radius: 0px !important;
                  border-bottom-right-radius: 0px !important;
                  margin-bottom: -1px !important;
                  box-shadow: none !important;
                }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.wc_lights_bath_user_inside
                name: Presence
                icon_color: blue
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 0px !important;
                      border-top: none !important;
                      border-bottom: none !important;
                      box-shadow: none !important;
                      margin-right: -1px !important;
                    }
              - type: custom:mushroom-entity-card
                entity: binary_sensor.wc_lights_bath_door
                name: Door
                icon_color: orange
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 0px !important;
                      border-top: none !important;
                      border-bottom: none !important;
                      box-shadow: none !important;
                    }
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.wc_lights_bath_total_time_inside
                name: Total Time Inside
              - entity: sensor.wc_lights_bath_time_user_spent_inside
                name: Time Inside
              - entity: sensor.wc_lights_bath_last_visit_duration_human
                name: Last Visit
              - entity: sensor.wc_lights_bath_max_time_user_inside_human
                name: Max Visit
              - entity: sensor.wc_lights_bath_visit_count
                name: Visit Count
              - type: section
                label: Settings
              - entity: number.wc_lights_bath_day_brightness
                name: Day Brightness
              - entity: number.wc_lights_bath_night_brightness
                name: Night Brightness
              - entity: number.wc_lights_bath_door_open_timeout
                name: Auto-Off Timeout
              - entity: select.wc_lights_bath_endstop_mode
                name: Sensor Mode
              - entity: select.wc_lights_bath_flash_color
                name: Post Visit Flash Color
              - entity: number.wc_lights_bath_post_visit_flash_duration
                name: Post Visit Flash Timeout
            card_mod:
              style: |
                ha-card {
                  border-top-left-radius: 0px !important;
                  border-top-right-radius: 0px !important;
                  border-top: none !important;
                  box-shadow: none !important;
                  margin-top: -1px !important;
                  overflow: visible !important;
                }
                .card-content {
                  padding-top: 0px !important;
                  overflow: visible !important;
                }
  - type: grid
    cards:
      - type: heading
        heading: ⚙️ Device System
      - type: vertical-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.wc_lights_device_status_strip
            name: Status LED Strip
            icon: mdi:led-strip-variant
            show_brightness_control: true
            use_light_color: true
            card_mod:
              style: |
                ha-card {
                  border-bottom-left-radius: 0px !important;
                  border-bottom-right-radius: 0px !important;
                  margin-bottom: -1px !important;
                  box-shadow: none !important;
                }
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Night Mode Schedule
              - entity: number.wc_lights_device_night_start_hour
                name: Start Hour
              - entity: number.wc_lights_device_night_start_minute
                name: Start Minute
              - entity: number.wc_lights_device_night_end_hour
                name: End Hour
              - entity: number.wc_lights_device_night_end_minute
                name: End Minute
              - type: section
                label: Hardware Config
              - entity: number.wc_lights_device_status_strip_flash_brightness
                name: Flash Brightness
              - entity: number.wc_lights_device_status_strip_length
                name: LED Count
            card_mod:
              style: |
                ha-card {
                  border-radius: 0px !important;
                  border-top: none !important;
                  border-bottom: none !important;
                  box-shadow: none !important;
                  margin-top: -1px !important;
                  margin-bottom: -1px !important;
                  overflow: visible !important;
                }
                .card-content {
                  overflow: visible !important;
                }
          - type: horizontal-stack
            cards:
              - type: button
                entity: button.wc_lights_device_restart_device
                name: Restart
                icon: mdi:restart
                card_mod:
                  style: |
                    ha-card {
                      border-top-left-radius: 0px !important;
                      border-top-right-radius: 0px !important;
                      border-top: none !important;
                      box-shadow: none !important;
                    }
              - type: button
                entity: button.wc_lights_device_reset_visit_counters
                name: Clear Stats
                icon: mdi:counter
                card_mod:
                  style: |
                    ha-card {
                      border-top-left-radius: 0px !important;
                      border-top-right-radius: 0px !important;
                      border-top: none !important;
                      box-shadow: none !important;
                    }
              - type: button
                entity: button.wc_lights_device_reset_wifi_and_device_settings
                name: Factory Reset
                icon: mdi:alert-circle
                card_mod:
                  style: |
                    ha-card {
                      border-top-left-radius: 0px !important;
                      border-top-right-radius: 0px !important;
                      border-top: none !important;
                      box-shadow: none !important;
                    }
              - type: button
                entity: button.wc_lights_device_test_status_strip_rainbow
                name: Rainbow
                icon: mdi:drawing-box
                card_mod:
                  style: |
                    ha-card {
                      border-top-left-radius: 0px !important;
                      border-top-right-radius: 0px !important;
                      border-top: none !important;
                      box-shadow: none !important;              
                    }
              - type: tile
                entity: sensor.wc_lights_device_wifi_rssi
                name: ""
                card_mod:
                  style: |
                    ha-card {
                      border-top-left-radius: 0px !important;
                      border-top-right-radius: 0px !important;
                      border-top: none !important;
                      box-shadow: none !important;              
                    }
cards: []
path: wc
icon: mdi:toilet
show_icon_and_title: false
badges:
  - type: entity
    entity: light.wc_lights_device_status_strip
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.wc_lights_wc_user_inside
    name: WC
    state_content: last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.wc_lights_bath_user_inside
    name: Bath
    state_content: last_changed
  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: button.wc_lights_wc_test_inside_blink_reminder
    name: WC Blink
    tap_action:
      action: toggle
