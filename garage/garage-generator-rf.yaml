substitutions:
  # 433 MHz ASK receiver/transmitter pins
  gpio_rf_rx: "27"
  gpio_rf_tx: "26"

  # RF defaults
  # Pulse length and repeat behavior from original remote profile.
  rf_pulse_length: "350"
  rf_repeat_times: "10"
  rf_repeat_wait: 15ms

  # Receiver decode parameters
  rf_tolerance: 50%
  rf_filter: 250us
  rf_idle: 8ms

  # Carrier duty for ASK RF modules.
  rf_carrier_duty_percent: 100%

