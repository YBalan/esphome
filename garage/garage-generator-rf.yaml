                  wait_time: ${rf_repeat_wait}
          else:
            - lambda: |-
                garage::show_rf_test_result(4, false);
            - component.update: lcd_display

  - id: rf_assign_btn_1
    mode: restart
    then:
      - lambda: |-
          garage::on_button_long_action(1);
      - component.update: rf_raw_btn_1_sensor
      - component.update: lcd_display

  - id: rf_assign_btn_2
    mode: restart
    then:
      - lambda: |-
          garage::on_button_long_action(2);
      - component.update: rf_raw_btn_2_sensor
