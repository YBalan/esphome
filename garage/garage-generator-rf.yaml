script:
  - id: rf_boot_sync
    mode: restart
    then:
      - switch.turn_off: rf_receiver_enabled
      - lambda: |-
          garage::leave_rf_learning_mode();
          garage::clear_lcd_message();
      - component.update: rf_raw_btn_1_sensor
      - component.update: rf_raw_btn_2_sensor
      - component.update: rf_raw_btn_3_sensor
      - component.update: rf_raw_btn_4_sensor

  - id: rf_send_btn_1
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rf_emulation_enabled
          then:
            - if:
                condition:
                  lambda: |-
                    return garage::button_rf_enabled(1);
                then:
                  - lambda: |-
                      garage::show_assigned_rf_for_button(1);
                  - component.update: lcd_display
                  - remote_transmitter.transmit_raw:
                      code: !lambda |-
                        return garage::button_rf_raw_timings(1);
                      repeat:
                        times: ${rf_repeat_times}
                        wait_time: ${rf_repeat_wait}

  - id: rf_send_btn_2
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rf_emulation_enabled
          then:
            - if:
                condition:
                  lambda: |-
                    return garage::button_rf_enabled(2);
                then:
                  - lambda: |-
                      garage::show_assigned_rf_for_button(2);
                  - component.update: lcd_display
                  - remote_transmitter.transmit_raw:
                      code: !lambda |-
                        return garage::button_rf_raw_timings(2);
                      repeat:
                        times: ${rf_repeat_times}
                        wait_time: ${rf_repeat_wait}

  - id: rf_send_btn_3
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rf_emulation_enabled
          then:
            - if:
                condition:
                  lambda: |-
                    return garage::button_rf_enabled(3);
                then:
                  - lambda: |-
                      garage::show_assigned_rf_for_button(3);
                  - component.update: lcd_display
                  - remote_transmitter.transmit_raw:
                      code: !lambda |-
                        return garage::button_rf_raw_timings(3);
                      repeat:
                        times: ${rf_repeat_times}
                        wait_time: ${rf_repeat_wait}

  - id: rf_send_btn_4
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rf_emulation_enabled
          then:
            - if:
                condition:
                  lambda: |-
                    return garage::button_rf_enabled(4);
                then:
                  - lambda: |-
                      garage::show_assigned_rf_for_button(4);
                  - component.update: lcd_display
                  - remote_transmitter.transmit_raw:
                      code: !lambda |-
                        return garage::button_rf_raw_timings(4);
                      repeat:
                        times: ${rf_repeat_times}
                        wait_time: ${rf_repeat_wait}

  - id: rf_test_btn_1
    mode: restart
    then:
      - lambda: |-
          garage::note_user_action();
      - if:
          condition:
            lambda: |-
              return garage::button_rf_enabled(1);
          then:
            - lambda: |-
                garage::show_rf_test_result(1, true);
            - component.update: lcd_display
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  return garage::button_rf_raw_timings(1);
                repeat:
                  times: ${rf_repeat_times}
                  wait_time: ${rf_repeat_wait}
          else:
            - lambda: |-
                garage::show_rf_test_result(1, false);
            - component.update: lcd_display

  - id: rf_test_btn_2
    mode: restart
    then:
      - lambda: |-
          garage::note_user_action();
      - if:
          condition:
            lambda: |-
              return garage::button_rf_enabled(2);
          then:
            - lambda: |-
                garage::show_rf_test_result(2, true);
            - component.update: lcd_display
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  return garage::button_rf_raw_timings(2);
