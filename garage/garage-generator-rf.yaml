  - id: rf_assign_btn_3
    mode: restart
    then:
      - lambda: |-
          garage::on_button_long_action(3);
      - component.update: rf_raw_btn_3_sensor
      - component.update: lcd_display

  - id: rf_assign_btn_4
    mode: restart
    then:
      - lambda: |-
          garage::on_button_long_action(4);
      - component.update: rf_raw_btn_4_sensor
      - component.update: lcd_display

  - id: rf_toggle_receiver
    mode: restart
    then:
      - lambda: |-
          garage::note_user_action();
      - if:
          condition:
            switch.is_on: rf_receiver_enabled
          then:
            - switch.turn_off: rf_receiver_enabled
          else:
            - switch.turn_on: rf_receiver_enabled
