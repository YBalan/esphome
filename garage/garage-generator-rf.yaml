    type: uint32_t
    restore_value: no
    initial_value: "0"

remote_receiver:
  pin:
    number: ${gpio_rf_rx}
    mode:
      input: true
  dump: []
  tolerance: ${rf_tolerance}
  filter: ${rf_filter}
  idle: ${rf_idle}
  buffer_size: 8kb
  on_raw:
    then:
      - lambda: |-
          if (!id(rf_receiver_enabled).state) {
            return;
          }
          if (!garage::is_rf_learning_mode()) {
            return;
          }
          if (!garage::on_rf_raw_received(x)) {
            return;
          }

remote_transmitter:
  pin: ${gpio_rf_tx}
  carrier_duty_percent: ${rf_carrier_duty_percent}
  non_blocking: true

switch:
  - platform: template
    id: rf_emulation_enabled
    name: ${friendly_name} Use RF
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: rf_receiver_enabled
    name: ${friendly_name} RF Receiver Enabled
    icon: mdi:radio-tower
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if (!garage::is_rf_learning_mode()) {
            garage::enter_rf_learning_mode();
          }
      - component.update: lcd_display
    on_turn_off:
      - lambda: |-
          if (garage::is_rf_learning_mode()) {
            garage::leave_rf_learning_mode();
            garage::wake_backlight();
            garage::clear_lcd_message();
          }
      - component.update: lcd_display

