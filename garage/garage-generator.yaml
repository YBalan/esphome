substitutions:
  # Device identity in ESPHome/Home Assistant
  device_name: generator
  friendly_name: Generator
  # Timezone
  time_zone: "Europe/Kyiv"

  # Fallback AP credentials (used when normal WiFi is unavailable)
  ap_ssid: "AP Generator"
  ap_password: "password"

  # GPIO mapping
  # Relays are active-low outputs
  gpio_relay_1: "5"
  gpio_relay_2: "18"
  gpio_relay_3: "19"
  gpio_relay_4: "23"

  # I2C bus for LCD backpack (PCF8574)
  gpio_i2c_sda: "21"
  gpio_i2c_scl: "22"

  # UART2 for PZEM-004T (ESP RX <- PZEM TX, ESP TX -> PZEM RX)
  gpio_uart_rx: "16"
  gpio_uart_tx: "17"

  # Environmental sensor input
  gpio_dht: "4"

  # Physical buttons (Button 5 is input-only pin on ESP32)
  gpio_btn_1: "14"
  gpio_btn_2: "25"
  gpio_btn_3: "32"
  gpio_btn_4: "33"
  gpio_btn_5: "35"

  # Functional defaults
  # Voltage considered as generator running
  voltage_running_threshold: "200.0"

  # Action timing
  motor_hours_update_interval: 30s

  # LCD and DHT refresh settings
  lcd_i2c_address: "0x27"
  lcd_update_interval: 5s
  dht_update_interval: 15s

packages:
  mqtt_feature: !include garage-generator-mqtt.yaml
  rf_feature: !include garage-generator-rf.yaml
  servos_feature: !include garage-generator-servos.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - garage_generator_logic.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          garage::wake_backlight();
      - script.execute: rf_boot_sync
      - component.update: last_run_start_sensor
      - component.update: last_run_stop_sensor
      - component.update: current_run_duration_sensor
      - component.update: servo_start_stop_values_sensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf # Stable for BLE + WiFi coexistence
    advanced:
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      # Add headroom for occasional heavy loop iterations under RF/network bursts.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
    
ota:
  - platform: esphome

# 1. Connection settings
wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password 
  # Fallback access point if WiFi disappears
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
    
  # Allow saving new credentials to flash memory
  fast_connect: true 
   # Keep Wi-Fi radio fully awake to reduce random disconnects.
  power_save_mode: NONE
  # If reconnect logic stalls for too long, reboot the node to self-heal.
  reboot_timeout: 1min

# Enables the web interface when in AP mode
captive_portal:

# Simple web server to change settings if already connected
web_server:
  port: 80

api: #For Home Assistant
  # Keep batching moderate to avoid large bursts of queued state updates.
  #batch_delay: 250ms
  # Allow short bursts when HA/network is briefly slow.
  max_send_queue: 64
  # Keep enough room for HA + temporary logger sessions.
  max_connections: 5
  # If API stays disconnected too long, reboot to self-heal WiFi/API stack.
  reboot_timeout: 10min

preferences:
  # Persist assigned RF codes quickly so they survive reboot/power cycles.
  flash_write_interval: 30s

time:
  - platform: sntp
    id: ha_time
    timezone: ${time_zone}

logger:
  level: INFO
  #tx_buffer_size: 1024
  # Keep serial monitor from holding reset/boot straps in programming mode.
  deassert_rts_dtr: true

globals:
  - id: motor_hours_total
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: motor_hours_offset
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: last_run_start_text_value
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: last_run_stop_text_value
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: last_run_duration
    type: std::string
    restore_value: yes
    initial_value: '"unknown"'
  - id: last_run_start_unix_s
    type: int32_t
    restore_value: yes
    initial_value: "0"
  - id: relay_1_timeout_s
    type: float
    restore_value: yes
    initial_value: "0.25"
  - id: relay_2_timeout_s
    type: float
    restore_value: yes
    initial_value: "0.25"
  - id: relay_3_timeout_s
    type: float
    restore_value: yes
    initial_value: "0.25"
  - id: relay_4_timeout_s
    type: float
    restore_value: yes
    initial_value: "0.25"
  - id: display_backlight_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: lcd_message_line_1
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: lcd_message_line_2
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: lcd_message_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: pzem_last_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: lcd_line2_mode
    type: int
    restore_value: yes
    initial_value: "0"

i2c:
  sda: ${gpio_i2c_sda}
  scl: ${gpio_i2c_scl}
  scan: true

uart:
  id: uart_pzem
  rx_pin: ${gpio_uart_rx}
  tx_pin: ${gpio_uart_tx}
  baud_rate: 9600

# modbus:
#   id: modbus_pzem
#   uart_id: uart_pzem
#   send_wait_time: 200ms

switch:
  # Relay 1: stop pulse output for the generator stop action.
  - platform: gpio
    id: relay_1
    name: ${friendly_name} Stop
    pin:
      number: ${gpio_relay_1}
      inverted: true
    on_turn_on:
      - script.execute: publish_relay_states
    on_turn_off:
      - script.execute: publish_relay_states
  # Relay 2: eco mode output.
  - platform: gpio
    id: relay_2
    name: ${friendly_name} Eco Mode
    pin:
      number: ${gpio_relay_2}
      inverted: true
    on_turn_on:
      - script.execute: publish_relay_states
    on_turn_off:
      - script.execute: publish_relay_states
  # Relay 3: start pulse output for the generator start action.
  - platform: gpio
    id: relay_3
    name: ${friendly_name} Start
    pin:
      number: ${gpio_relay_3}
      inverted: true
    on_turn_on:
      - script.execute: publish_relay_states
    on_turn_off:
      - script.execute: publish_relay_states
  # Relay 4: rollete output used for the garage rollete action.
  - platform: gpio
    id: relay_4
    name: ${friendly_name} Rollete
    pin:
      number: ${gpio_relay_4}
      inverted: true
    on_turn_on:
      - script.execute: publish_relay_states
    on_turn_off:
      - script.execute: publish_relay_states
  - platform: template
    id: display_enabled
    name: ${friendly_name} Display Enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: mqtt_runtime_enabled
    name: ${friendly_name} MQTT Enabled
    icon: mdi:mqtt
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: physical_buttons_enabled
    name: ${friendly_name} Physical Buttons Enabled
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    id: ha_btn_wifi_reset
    name: ${friendly_name} WiFi Reset
    icon: mdi:wifi-refresh
    entity_category: diagnostic
    on_press:
      # Force WiFi reconnection without full device reboot.
      - wifi.disable:
      - delay: 2s
      - wifi.enable:

    # WiFi Reset Button
  - platform: factory_reset
    name: ${friendly_name} Factory Reset
    id: reset_wifi_btn
    icon: "mdi:wifi-reset"

  - platform: restart
    name: ${friendly_name} Restart Device
    id: restart_btn
    icon: "mdi:restart"

  - platform: template
    id: reset_motor_hours_btn
    name: ${friendly_name} Reset Motor Hours
    icon: mdi:counter
    entity_category: config
    on_press:
      - lambda: |-
          garage::reset_motor_hours_counter();
      - component.update: motor_hours

  - platform: template
    id: reset_all_counters_btn
    name: ${friendly_name} Reset All Counters
    icon: mdi:restore
    entity_category: config
    on_press:
      - lambda: |-
          garage::reset_all_counters();
      - component.update: motor_hours

  # HA action parity for physical buttons
  - platform: template
    id: ha_btn_stop
    name: ${friendly_name} Action Stop
    icon: mdi:stop-circle
    on_press:
      - script.execute: button_1_action

  - platform: template
    id: ha_btn_stop_long
    name: ${friendly_name} Action Stop Long
    icon: mdi:gesture-tap-hold
    on_press:
      - script.execute: rf_assign_btn_1

  - platform: template
    id: ha_btn_eco_toggle
    name: ${friendly_name} Action Eco On
    icon: mdi:leaf
    on_press:
      - script.execute: button_2_action

  - platform: template
    id: ha_btn_eco_long
    name: ${friendly_name} Action Eco Long
    icon: mdi:gesture-tap-hold
    on_press:
      - script.execute: rf_assign_btn_2

  - platform: template
    id: ha_btn_start
    name: ${friendly_name} Action Start
    icon: mdi:play-circle
    on_press:
      - script.execute: button_3_action

  - platform: template
    id: ha_btn_start_long
    name: ${friendly_name} Action Start Long
    icon: mdi:gesture-tap-hold
    on_press:
      - script.execute: rf_assign_btn_3

  - platform: template
    id: ha_btn_rollete
    name: ${friendly_name} Action Rollete
    icon: mdi:garage-open
    on_press:
      - script.execute: button_4_action

  - platform: template
    id: ha_btn_rollete_long
    name: ${friendly_name} Action Rollete Long
    icon: mdi:gesture-tap-hold
    on_press:
      - script.execute: rf_assign_btn_4

  - platform: template
    id: ha_btn_settings_short
    name: ${friendly_name} Action Settings Short
    icon: mdi:tune
    on_press:
      - script.execute: button_5_short_action

  - platform: template
    id: ha_btn_settings_long
    name: ${friendly_name} Action Settings Long
    icon: mdi:radio-tower
    on_press:
      - script.execute: button_5_long_action

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: ${friendly_name} WiFi RSSI
    update_interval: 30s

  - platform: pzemac
    #modbus_id: modbus_pzem
    #address: 0x01
    update_interval: 2s
    voltage:
      id: pzem_voltage
      name: ${friendly_name} Voltage
      filters:
        - throttle: 2s
      on_value:
        then:
          - lambda: |-
              garage::mark_pzem_rx_if_finite(x);
    current:
      id: pzem_current
      name: ${friendly_name} Current
      filters:
        - throttle: 3s
    power:
      id: pzem_power
      name: ${friendly_name} Power
      filters:
        - throttle: 5s
    energy:
      id: pzem_energy
      name: ${friendly_name} Energy
      filters:
        - throttle: 29s
    frequency:
      id: pzem_frequency
      name: ${friendly_name} Frequency
      filters:
        - throttle: 11s
    power_factor:
      id: pzem_power_factor
      name: ${friendly_name} Power Factor
      filters:
        - throttle: 7s

  - platform: dht
    pin: ${gpio_dht}
    model: DHT22
    update_interval: ${dht_update_interval}
    temperature:
      id: dht_temperature
      name: ${friendly_name} Temperature
    humidity:
      id: dht_humidity
      name: ${friendly_name} Humidity
  - platform: template
    id: motor_hours
    name: ${friendly_name} Motor Hours
    unit_of_measurement: h
    accuracy_decimals: 2
    icon: mdi:engine-outline
    state_class: total_increasing
    update_interval: ${motor_hours_update_interval}
    lambda: |-
      return garage::motor_hours_total_value();  

text_sensor:
  - platform: template
    id: last_run_start_sensor
    name: ${friendly_name} Last Run Start
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      return garage::last_run_start_text();
  - platform: template
    id: last_run_stop_sensor
    name: ${friendly_name} Last Run Stop
    icon: mdi:clock-end
    update_interval: 60s
    lambda: |-
      return garage::last_run_stop_text();
  - platform: template
    id: last_run_duration_sensor
    name: ${friendly_name} Last Run Duration
    icon: mdi:timer-outline
    update_interval: 60s
    lambda: |-
      return garage::last_run_duration_text();
  - platform: template
    id: current_run_duration_sensor
    name: ${friendly_name} Current Run Duration
    icon: mdi:timer-play-outline
    update_interval: 60s
    lambda: |-
      return garage::current_run_duration_text(id(ha_time).now(), id(generator_running).state);

number:
  - platform: template
    id: motor_hours_offset_input
    name: ${friendly_name} Motor Hours Offset
    icon: mdi:counter
    entity_category: config
    mode: box
    min_value: 0.0
    max_value: 100000.0
    step: 0.1
    lambda: |-
      return garage::motor_hours_offset_value();
    set_action:
      - lambda: |-
          garage::set_motor_hours_offset(x);

  - platform: template
    id: relay_1_timeout
    name: ${friendly_name} Timeout Stop
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: -1.0
    max_value: 4000000.0
    step: 0.1
    lambda: |-
      return garage::button_timeout_seconds(1);
    set_action:
      - lambda: |-
          garage::set_button_timeout_seconds(1, x);

  - platform: template
    id: relay_2_timeout
    name: ${friendly_name} Timeout Eco
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: -1.0
    max_value: 4000000.0
    step: 0.1
    lambda: |-
      return garage::button_timeout_seconds(2);
    set_action:
      - lambda: |-
          garage::set_button_timeout_seconds(2, x);

  - platform: template
    id: relay_3_timeout
    name: ${friendly_name} Timeout Start
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: -1.0
    max_value: 4000000.0
    step: 0.1
    lambda: |-
      return garage::button_timeout_seconds(3);
    set_action:
      - lambda: |-
          garage::set_button_timeout_seconds(3, x);

  - platform: template
    id: relay_4_timeout
    name: ${friendly_name} Timeout Rollete
    icon: mdi:timer-outline
    entity_category: config
    mode: box
    min_value: -1.0
    max_value: 4000000.0
    step: 0.1
    lambda: |-
      return garage::button_timeout_seconds(4);
    set_action:
      - lambda: |-
          garage::set_button_timeout_seconds(4, x);

binary_sensor:
  - platform: template
    id: generator_running
    name: ${friendly_name} Running
    device_class: running
    lambda: |-
      return garage::is_generator_running_with_pzem_freshness(
          id(pzem_voltage).state, ${voltage_running_threshold});
    on_press:
      - lambda: |-
          garage::on_generator_run_started(id(ha_time).now());
      - component.update: last_run_start_sensor
      - component.update: current_run_duration_sensor
    on_release:
      - lambda: |-
          garage::on_generator_run_stopped(id(ha_time).now());
      - component.update: last_run_stop_sensor
      - component.update: last_run_duration_sensor
      - component.update: current_run_duration_sensor

  # Button 1: Stop generator.
  # Action: pulse Relay 1, move the mirrored choke servos, and send learned RF if set.
  - platform: gpio
    id: btn_1_stop
    name: ${friendly_name} Stop
    internal: true
    pin:
      number: ${gpio_btn_1}
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_1_action
      - timing:
          - ON for at least 600ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: rf_assign_btn_1

  # Button 2: Eco mode.
  # Action: turn Relay 2 on and send learned RF if set.
  - platform: gpio
    id: btn_2_eco
    name: ${friendly_name} Eco
    internal: true
    pin:
      number: ${gpio_btn_2}
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_2_action
      - timing:
          - ON for at least 600ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: rf_assign_btn_2

  # Button 3: Start generator.
  # Action: pulse Relay 3 and send learned RF if set.
  - platform: gpio
    id: btn_3_start
    name: ${friendly_name} Start
    internal: true
    pin:
      number: ${gpio_btn_3}
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_3_action
      - timing:
          - ON for at least 600ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: rf_assign_btn_3

  # Button 4: Garage rollete.
  # Action: pulse Relay 4 and send learned RF if set.
  - platform: gpio
    id: btn_4_rollete
    name: ${friendly_name} Rollete
    internal: true
    pin:
      number: ${gpio_btn_4}
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_4_action
      - timing:
          - ON for at least 600ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: rf_assign_btn_4

  # Button 5: Settings and display control.
  # Action: short press wakes LCD backlight, long press enters/exits RF learn mode.
  - platform: gpio
    id: btn_5_settings
    name: ${friendly_name} Settings
    internal: true
    pin:
      number: ${gpio_btn_5}
      mode:
        input: true
        #pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_5_short_action
      - timing:
          - ON for at least 600ms
        then:
          - if:
              condition:
                switch.is_on: physical_buttons_enabled
              then:
                - script.execute: button_5_long_action

display:
  - platform: lcd_pcf8574
    id: lcd_display
    dimensions: 16x2
    address: ${lcd_i2c_address}
    update_interval: ${lcd_update_interval}
    lambda: |-
      garage::render_lcd_page(
          it,
          id(display_enabled).state,
          id(dht_temperature).state,
          id(dht_humidity).state,
          id(pzem_voltage).state,
          id(pzem_current).state,
          id(pzem_power).state,
          id(pzem_power_factor).state);

interval:
  - interval: 1s
    then:
      - lambda: |-
          garage::zero_pzem_sensors_if_stale();
          garage::accumulate_runtime_tick(id(generator_running).state);

script:
  - id: relay_1_pulse
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return garage::button_timeout_is_infinite(1);
          then:
            # -1 means infinite timeout: treat action as relay toggle.
            - if:
                condition:
                  switch.is_on: relay_1
                then:
                  - switch.turn_off: relay_1
                else:
                  - switch.turn_on: relay_1
          else:
            - switch.turn_on: relay_1
            - delay: !lambda |-
                return garage::button_timeout_ms(1);
            - switch.turn_off: relay_1

  - id: relay_2_pulse
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return garage::button_timeout_is_infinite(2);
          then:
            # -1 means infinite timeout: treat action as relay toggle.
            - if:
                condition:
                  switch.is_on: relay_2
                then:
                  - switch.turn_off: relay_2
                else:
                  - switch.turn_on: relay_2
          else:
            - switch.turn_on: relay_2
            - delay: !lambda |-
                return garage::button_timeout_ms(2);
            - switch.turn_off: relay_2

  - id: relay_3_pulse
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return garage::button_timeout_is_infinite(3);
          then:
            # -1 means infinite timeout: treat action as relay toggle.
            - if:
                condition:
                  switch.is_on: relay_3
                then:
                  - switch.turn_off: relay_3
                else:
                  - switch.turn_on: relay_3
          else:
            - switch.turn_on: relay_3
            - delay: !lambda |-
                return garage::button_timeout_ms(3);
            - switch.turn_off: relay_3

  - id: relay_4_pulse
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return garage::button_timeout_is_infinite(4);
          then:
            # -1 means infinite timeout: treat action as relay toggle.
            - if:
                condition:
                  switch.is_on: relay_4
                then:
                  - switch.turn_off: relay_4
                else:
                  - switch.turn_on: relay_4
          else:
            - switch.turn_on: relay_4
            - delay: !lambda |-
                return garage::button_timeout_ms(4);
            - switch.turn_off: relay_4

  - id: button_1_action
    mode: single
    then:
      - lambda: |-
          garage::note_user_action();          
      - delay: 1000ms
      - script.execute: relay_1_pulse
      - if:
          condition:
            and:
              - switch.is_on: use_servos_enabled
              - switch.is_on: use_servo_action_stop
          then:
            - script.execute: servo_sweep_to_stop
      - script.execute: rf_send_btn_1

  - id: button_2_action
    mode: single
    then:
      - lambda: |-
          garage::note_user_action();
      - script.execute: relay_2_pulse
      - if:
          condition:
            and:
              - switch.is_on: use_servos_enabled
              - switch.is_on: use_servo_action_eco
          then:
            - script.execute: servo_sweep_to_stop
      - script.execute: rf_send_btn_2

  - id: button_3_action
    mode: single
    then:
      - lambda: |-
          garage::note_user_action();
      - script.execute: relay_3_pulse
      - if:
          condition:
            and:
              - switch.is_on: use_servos_enabled
              - switch.is_on: use_servo_action_start
          then:
            - script.execute: servo_sweep_to_stop
      - script.execute: rf_send_btn_3

  - id: button_4_action
    mode: single
    then:
      - lambda: |-
          garage::note_user_action();
      - script.execute: relay_4_pulse
      - if:
          condition:
            and:
              - switch.is_on: use_servos_enabled
              - switch.is_on: use_servo_action_rollete
          then:
            - script.execute: servo_sweep_to_stop
      - script.execute: rf_send_btn_4

  - id: button_5_short_action
    mode: restart
    then:
      - lambda: |-
          garage::wake_backlight();
          garage::cycle_lcd_line2_mode();
      - component.update: lcd_display

  - id: button_5_long_action
    mode: restart
    then:
      - script.execute: rf_toggle_receiver
