substitutions:
  # Distinct from the ESP8266 variant's device_name/ap_ssid - besides
  # avoiding node-name/AP-SSID collisions if both are ever on the same
  # network, this also keeps their .esphome build directories separate
  # (sharing one mixed ESP8266-Arduino/ESP32-esp-idf build dir corrupted
  # the ESP32 build with stale artifacts).
  device_name: generator-charger-esp32
  friendly_name: Generator Charger
  ap_ssid: AP-Generator-Charger-32
  ap_password: password
  time_zone: Europe/Kyiv
  wifi_rssi_update: 60s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - garage-charger-charging.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  common: !include garage-charger-common.yaml
  pins: !include garage-charger-esp32-pins.yaml
  charging: !include garage-charger-charging.yaml
  mqtt: !include garage-charger-mqtt.yaml

# Default reboot_timeout (15min) would otherwise reboot the device if it
# can't reach Home Assistant - which raced with wifi.ap.ap_timeout and could
# preempt the AP fallback before it ever stabilized. Disabled for the same
# reason wifi.reboot_timeout is disabled in the common package.
api:
  reboot_timeout: 0s
